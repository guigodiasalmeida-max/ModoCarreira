<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareerMode — Simulador de Carreira</title>

<style>

:root{
    --bg:#061009;
    --bg2:#0a150e;
    --panel:#0f1d14;
    --panel2:#13261a;
    --border:#263d2e;
    --green:#19d66f;
    --green2:#36ef89;
    --greenDark:#0ca44f;
    --white:#f4f7f5;
    --muted:#93a197;
    --gold:#f0c85e;
    --red:#ff6d6d;
    --blue:#6ba8ff;
    --shadow:0 24px 70px rgba(0,0,0,.34);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    color:var(--white);
    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(25,214,111,.11),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 12%,
            rgba(105,168,255,.06),
            transparent 25%
        ),
        linear-gradient(
            180deg,
            #07100b 0%,
            #040705 100%
        );
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none!important;
}

.app{
    width:min(1200px,100%);
    margin:auto;
    padding:20px;
}

/* =========================================================
   PAINÉIS
========================================================= */

.panel{
    background:
        linear-gradient(
            180deg,
            rgba(17,31,22,.98),
            rgba(9,18,13,.98)
        );
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:var(--shadow);
}

.panel-header{
    padding:24px;
    border-bottom:1px solid var(--border);
}

.panel-body{
    padding:24px;
}

.center{
    text-align:center;
}

.title{
    margin:0;
    font-size:30px;
    font-weight:900;
    letter-spacing:-1px;
}

.subtitle{
    margin:7px 0 0;
    color:var(--muted);
    line-height:1.55;
}

.small{
    font-size:12px;
}

.muted{
    color:var(--muted);
}

.spacer{
    height:18px;
}

/* =========================================================
   BOTÕES
========================================================= */

.btn{
    padding:14px 20px;
    margin:4px;
    border-radius:13px;
    background:var(--green);
    color:#061108;
    font-weight:900;
    cursor:pointer;
    transition:.18s;
}

.btn:hover{
    background:var(--green2);
    transform:translateY(-2px);
}

.btn.secondary{
    color:white;
    background:#18251d;
    border:1px solid var(--border);
}

.btn.secondary:hover{
    background:#223127;
}

.btn.danger{
    color:#ffabab;
    background:#321717;
    border:1px solid #593333;
}

/* =========================================================
   HOME
========================================================= */

.home{
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero{
    width:min(900px,100%);
    text-align:center;
}

.badge{
    display:inline-block;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(25,214,111,.08);
    border:1px solid rgba(25,214,111,.22);
    color:#b9efd0;
    font-size:12px;
    font-weight:900;
    letter-spacing:.8px;
}

.hero h1{
    margin:20px 0 0;
    font-size:clamp(48px,9vw,90px);
    line-height:.95;
    letter-spacing:-5px;
}

.hero h1 span{
    color:var(--green);
}

.hero p{
    max-width:700px;
    margin:24px auto 30px;
    color:var(--muted);
    font-size:18px;
    line-height:1.65;
}

/* =========================================================
   FORMULÁRIO
========================================================= */

.form-box{
    width:min(600px,100%);
    margin:50px auto;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#adbbb1;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
}

.input,
.select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #304637;
    background:#09120c;
    color:white;
    outline:none;
}

.input:focus,
.select:focus{
    border-color:var(--green);
}

/* =========================================================
   POSIÇÕES
========================================================= */

.position-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.position{
    padding:20px 10px;
    border-radius:15px;
    border:1px solid var(--border);
    color:white;
    background:#101b14;
    cursor:pointer;
    transition:.18s;
}

.position:hover,
.position.selected{
    transform:translateY(-2px);
    border-color:var(--green);
    background:#16241a;
}

.position .sigla{
    font-size:22px;
    font-weight:900;
}

.position .nome{
    margin-top:7px;
    font-size:11px;
    color:var(--muted);
}

/* =========================================================
   PLAYER
========================================================= */

.player-card{
    padding:24px;
    border:1px solid var(--border);
    border-radius:19px;
    background:
        radial-gradient(
            circle at top right,
            rgba(25,214,111,.10),
            transparent 30%
        ),
        #111d15;
}

.player-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.player-name{
    font-size:32px;
    font-weight:900;
}

.meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.pill{
    padding:7px 10px;
    border-radius:999px;
    border:1px solid #2b4132;
    background:#16231b;
    color:#bfcbc2;
    font-size:12px;
    font-weight:800;
}

.overall{
    min-width:100px;
    padding:13px;
    border-radius:16px;
    background:rgba(25,214,111,.07);
    border:1px solid rgba(25,214,111,.20);
    text-align:center;
}

.overall-label{
    display:block;
    color:#91a098;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
}

.overall-number{
    display:block;
    color:var(--green);
    font-size:42px;
    font-weight:900;
    line-height:1.05;
}

/* =========================================================
   ATRIBUTOS
========================================================= */

.attribute-list{
    display:grid;
    gap:10px;
}

.attribute{
    padding:14px;
    border:1px solid #213428;
    border-radius:13px;
    background:#0b140e;
}

.attribute-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.attribute-name{
    font-weight:900;
}

.attribute-value{
    font-size:20px;
    font-weight:900;
    color:var(--green);
}

.bar{
    width:100%;
    height:8px;
    border-radius:999px;
    overflow:hidden;
    background:#1a261e;
}

.bar > div{
    height:100%;
    border-radius:inherit;
    background:
        linear-gradient(
            90deg,
            var(--greenDark),
            var(--green)
        );
}

/* =========================================================
   ROLETA
========================================================= */

.roulette{
    max-width:900px;
    margin:35px auto;
    padding:35px 20px;
    text-align:center;
}

.roulette-circle{
    width:230px;
    height:230px;
    margin:0 auto 25px;
    border-radius:50%;
    background:
        conic-gradient(
            var(--green),
            #0c753d,
            #35ec88,
            #135d36,
            var(--green)
        );
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 0 0 12px rgba(25,214,111,.05),
        0 25px 70px rgba(25,214,111,.12);
}

.roulette-inner{
    width:182px;
    height:182px;
    border-radius:50%;
    background:#09100b;
    border:1px solid #2b4633;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.roulette-icon{
    font-size:34px;
}

.roulette-name{
    max-width:160px;
    margin-top:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:28px;
    font-weight:900;
}

.roulette-running{
    animation:pulse .35s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.04);
    }
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:24px;
}

.choice{
    padding:17px 10px;
    border-radius:14px;
    border:1px solid #2b4132;
    background:#111d15;
    color:white;
    cursor:pointer;
    transition:.18s;
}

.choice:hover{
    transform:translateY(-2px);
    background:#18271d;
    border-color:var(--green);
}

.choice span{
    display:block;
    margin-bottom:6px;
    color:#8e9b93;
    font-size:12px;
}

.choice strong{
    color:var(--green);
    font-size:25px;
}

/* =========================================================
   CLUBE
========================================================= */

.club-name{
    margin:20px 0;
    font-size:clamp(38px,7vw,65px);
    font-weight:900;
    letter-spacing:-3px;
}

/* =========================================================
   CARREIRA
========================================================= */

.career-header{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

.career-player,
.career-season{
    padding:22px;
    border-radius:20px;
    border:1px solid var(--border);
}

.career-player{
    background:
        radial-gradient(
            circle at top right,
            rgba(25,214,111,.10),
            transparent 30%
        ),
        #112016;
}

.career-season{
    background:#101912;
}

.career-player-name{
    font-size:28px;
    font-weight:900;
}

.season-label{
    color:var(--muted);
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
}

.season-number{
    margin-top:4px;
    font-size:42px;
    font-weight:900;
}

/* =========================================================
   PARTIDA
========================================================= */

.match{
    padding:34px 20px;
    text-align:center;
}

.match-label{
    color:var(--muted);
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
}

.teams{
    max-width:850px;
    margin:30px auto;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:18px;
}

.team{
    font-size:23px;
    font-weight:900;
}

.score{
    font-size:50px;
    font-weight:900;
}

/* =========================================================
   MENUS
========================================================= */

.menu-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-top:15px;
}

.menu-card{
    padding:18px;
    border-radius:17px;
    border:1px solid var(--border);
    background:#0e1812;
    color:white;
    text-align:left;
    cursor:pointer;
    transition:.18s;
}

.menu-card:hover{
    transform:translateY(-2px);
    background:#15231a;
    border-color:#34513d;
}

.menu-icon{
    font-size:28px;
    margin-bottom:13px;
}

.menu-title{
    font-weight:900;
}

.menu-text{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
}

/* =========================================================
   STATS
========================================================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.stat-card{
    padding:20px;
    border-radius:17px;
    border:1px solid var(--border);
    background:#0d1710;
    text-align:center;
}

.stat-number{
    font-size:37px;
    font-weight:900;
}

.stat-label{
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

/* =========================================================
   TABELA
========================================================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:780px;
    border-collapse:collapse;
}

th,
td{
    padding:13px 8px;
    border-bottom:1px solid #213127;
    text-align:center;
    font-size:13px;
}

th{
    color:#7e8d83;
    font-size:11px;
    text-transform:uppercase;
}

.club-column{
    text-align:left;
}

.my-club{
    background:rgba(25,214,111,.06);
}

.my-club td{
    color:#d3f7df;
    font-weight:900;
}

/* =========================================================
   RODADAS
========================================================= */

.round-card{
    padding:18px;
    border-radius:18px;
    border:1px solid var(--border);
    background:#0d1710;
    margin-bottom:12px;
}

.round-title{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-bottom:12px;
    font-weight:900;
}

.fixture{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:11px 4px;
    border-bottom:1px solid #1d2c22;
    color:#ced8d0;
}

.fixture:last-child{
    border-bottom:0;
}

.fixture.mine{
    color:#d9fce6;
    font-weight:900;
}

.fixture span:last-child{
    white-space:nowrap;
}

/* =========================================================
   TRANSFERÊNCIAS
========================================================= */

.offer{
    padding:20px;
    margin-bottom:12px;
    border-radius:17px;
    border:1px solid var(--border);
    background:#0d1710;
}

.offer-club{
    font-size:23px;
    font-weight:900;
}

.offer-details{
    margin-top:7px;
    color:var(--muted);
    line-height:1.6;
    font-size:13px;
}

/* =========================================================
   RESULTADOS
========================================================= */

.performance{
    max-width:700px;
    margin:20px auto;
    padding:22px;
    border-radius:17px;
    border:1px solid var(--border);
    background:#0c160f;
}

.match-rating{
    color:var(--green);
    font-size:50px;
    font-weight:900;
}

.win{
    color:var(--green);
}

.draw{
    color:var(--gold);
}

.loss{
    color:var(--red);
}

.notice{
    padding:15px;
    border-radius:14px;
    border:1px solid #2b4433;
    background:#142319;
    color:#c9d7ce;
    line-height:1.6;
}

/* =========================================================
   RANKINGS
========================================================= */

.leader-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.leader-list{
    padding:18px;
    border-radius:17px;
    border:1px solid var(--border);
    background:#0d1710;
}

.leader-row{
    display:grid;
    grid-template-columns:42px 1fr auto;
    gap:8px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #1d2c22;
}

.leader-row:last-child{
    border-bottom:0;
}

.chip{
    display:inline-block;
    padding:5px 8px;
    border-radius:999px;
    background:#16251b;
    border:1px solid #294030;
    color:#bcd0c3;
    font-size:11px;
}

/* =========================================================
   HISTÓRICO
========================================================= */

.history-row{
    display:grid;
    grid-template-columns:100px 1fr 80px 80px 70px;
    gap:8px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #1c2b21;
}

.history-row:last-child{
    border-bottom:0;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    right:18px;
    bottom:18px;
    max-width:360px;
    padding:15px 18px;
    border-radius:14px;
    background:#102016;
    border:1px solid #2f4937;
    color:#d7e8dc;
    box-shadow:var(--shadow);
    z-index:100;
    animation:toastIn .2s ease-out;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    display:grid;
    place-items:center;
    min-height:260px;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #203127;
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   RESPONSIVO — CELULAR
========================================================= */

@media (max-width: 1000px){

    .app{
        width:100%;
        padding:16px;
    }

    .menu-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .career-header{
        grid-template-columns:1fr;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

}


/* =========================================================
   RESPONSIVO — CELULAR PEQUENO
========================================================= */

@media (max-width: 650px){

    body{
        overflow-x:hidden;
    }

    .app{
        width:100%;
        padding:10px;
    }


    /* -------------------------
       TÍTULOS
    ------------------------- */

    .title{
        font-size:23px;
        letter-spacing:-.5px;
    }

    .hero h1{
        font-size:48px;
        letter-spacing:-3px;
    }

    .hero p{
        font-size:15px;
        line-height:1.5;
    }


    /* -------------------------
       PAINÉIS
    ------------------------- */

    .panel{
        border-radius:16px;
    }

    .panel-header{
        padding:18px;
    }

    .panel-body{
        padding:16px;
    }


    /* -------------------------
       BOTÕES
    ------------------------- */

    .btn{
        width:100%;
        margin:5px 0;
        min-height:50px;
        font-size:14px;
    }


    /* -------------------------
       FORMULÁRIOS
    ------------------------- */

    .form-box{
        width:100%;
        margin:25px auto;
    }

    .input,
    .select{
        min-height:50px;
        font-size:16px;
    }


    /* -------------------------
       POSIÇÕES
    ------------------------- */

    .position-grid{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .position{
        padding:17px 8px;
        min-height:95px;
    }

    .position .sigla{
        font-size:20px;
    }


    /* -------------------------
       PLAYER
    ------------------------- */

    .player-top{
        flex-direction:column;
        align-items:stretch;
    }

    .player-name{
        font-size:25px;
        word-break:break-word;
    }

    .overall{
        width:100%;
    }

    .overall-number{
        font-size:36px;
    }

    .meta{
        gap:6px;
    }

    .pill{
        font-size:11px;
    }


    /* -------------------------
       ATRIBUTOS
    ------------------------- */

    .attribute{
        padding:12px;
    }

    .attribute-value{
        font-size:18px;
    }


    /* -------------------------
       ROLETA
    ------------------------- */

    .roulette{
        margin:15px auto;
        padding:25px 12px;
    }

    .roulette-circle{
        width:190px;
        height:190px;
    }

    .roulette-inner{
        width:150px;
        height:150px;
    }

    .roulette-name{
        max-width:130px;
        font-size:22px;
    }

    .choice-grid{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .choice{
        min-height:85px;
    }


    /* -------------------------
       CLUBE
    ------------------------- */

    .club-name{
        font-size:40px;
        letter-spacing:-2px;
        word-break:break-word;
    }


    /* -------------------------
       CABEÇALHO DA CARREIRA
    ------------------------- */

    .career-player,
    .career-season{
        padding:16px;
    }

    .career-player-name{
        font-size:23px;
        word-break:break-word;
    }

    .season-number{
        font-size:34px;
    }


    /* -------------------------
       PARTIDA
    ------------------------- */

    .match{
        padding:22px 12px;
    }

    .teams{
        display:flex;
        flex-direction:column;
        gap:10px;
        margin:22px auto;
    }

    .team{
        width:100%;
        font-size:20px;
        text-align:center;
        word-break:break-word;
    }

    .score{
        font-size:38px;
    }


    /* -------------------------
       MENU
    ------------------------- */

    .menu-grid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .menu-card{
        min-height:120px;
        padding:14px;
        border-radius:14px;
    }

    .menu-icon{
        font-size:24px;
        margin-bottom:9px;
    }

    .menu-title{
        font-size:13px;
    }

    .menu-text{
        font-size:11px;
    }


    /* -------------------------
       ESTATÍSTICAS
    ------------------------- */

    .stats-grid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .stat-card{
        padding:15px 10px;
        border-radius:14px;
    }

    .stat-number{

function aleatorio(min,max){

    return Math.random() *
        (max-min) +
        min;

}

function inteiro(min,max){

    return Math.floor(
        Math.random() *
        (max-min+1)
    ) +
    min;

}

function clamp(valor,min,max){

    return Math.max(
        min,
        Math.min(
            max,
            valor
        )
    );

}

function arredondar(valor,digitos=0){

    const fator =
        10 ** digitos;

    return Math.round(
        valor*fator
    ) /
    fator;

}

function embaralhar(array){

    const copia=[
        ...array
    ];

    for(
        let i=copia.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i+1)
            );

        [
            copia[i],
            copia[j]
        ]=[
            copia[j],
            copia[i]
        ];

    }

    return copia;

}

function obterForcaClube(clube){

function moeda(valor){

    if(valor>=1000000){

        return "€" +
            (valor/1000000).toFixed(1) +
            "M";

    }

    return "€" +
        Math.round(
            valor/1000
        ) +
        "K";

}

function escaparHTML(texto){

    return String(texto)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

    const toast =

            "div"

/* =========================================================

========================================================= */

function criarTabela(){

    const pais =
        obterPaisLigaAtual();

    const clubes =
        ligas[pais].clubes;

    tabela =
        clubes.map(
            clube => ({

                clube,

                jogos:0,

                vitorias:0,

                empates:0,

                derrotas:0,

                gf:0,

                ga:0,

                sg:0,

                pontos:0

            })
        );

}


/* =========================================================
   OBTER TIME NA TABELA
========================================================= */

function obterTabelaClube(
    clube
){

    return tabela.find(
        item =>
            item.clube === clube
    );

}


/* =========================================================
   ORDENAR TABELA
========================================================= */

function ordenarTabela(){

    tabela.sort(
        (a,b)=>{

            if(
                b.pontos !==
                a.pontos
            ){

                return (
                    b.pontos -
                    a.pontos
                );

            }

            if(
                b.sg !==
                a.sg
            ){

                return (
                    b.sg -
                    a.sg
                );

            }

            if(
                b.gf !==
                a.gf
            ){

                return (
                    b.gf -
                    a.gf
                );

            }

            if(
                b.vitorias !==
                a.vitorias
            ){

                return (
                    b.vitorias -
                    a.vitorias
                );

            }

            return a.clube.localeCompare(
                b.clube
            );

        }
    );

}


/* =========================================================
   ATUALIZAR TABELA
========================================================= */

function atualizarTabela(
    clubeA,
    clubeB,
    golsA,
    golsB
){

    const a =
        obterTabelaClube(
            clubeA
        );

    const b =
        obterTabelaClube(
            clubeB
        );

    if(
        !a ||
        !b
    ){

        return;

    }

    a.jogos++;
    b.jogos++;

    a.gf += golsA;
    a.ga += golsB;

    b.gf += golsB;
    b.ga += golsA;

    a.sg =
        a.gf -
        a.ga;

    b.sg =
        b.gf -
        b.ga;

    if(
        golsA >
        golsB
    ){

        a.vitorias++;

        a.pontos += 3;

        b.derrotas++;

    }

    else if(
        golsA <
        golsB
    ){

        b.vitorias++;

        b.pontos += 3;

        a.derrotas++;

    }

    else{

        a.empates++;

        b.empates++;

        a.pontos++;

        b.pontos++;

    }

}

/* =========================================================
   GERAR CAMPEONATO
========================================================= */

function criarCalendario(){

    const pais =
        obterPaisLigaAtual();

    const clubes =
        ligas[pais].clubes;

    if(
        clubes.length !== 20
    ){

        throw new Error(
            "A liga precisa ter 20 clubes."
        );

    }

    /*
     * Método do círculo.
     *
     * 20 clubes:
     *
     * 19 rodadas no primeiro turno.
     * 19 rodadas no segundo turno.
     *
     * TOTAL:
     *
     * 38 rodadas.
     */

    const base =
        embaralhar(
            clubes
        );

    let lista =
        [...base];

    const primeiroTurno=[];


    /* -----------------------------------------------------
       PRIMEIRO TURNO
    ----------------------------------------------------- */

    for(
        let rodada=0;
        rodada<19;
        rodada++
    ){

        const jogos=[];

        for(
            let i=0;
            i<10;
            i++
        ){

            const timeA =
                lista[i];

            const timeB =
                lista[
                    19-i
                ];

            let casa;
            let fora;


            /*
             * Alternamos o mando para
             * distribuir melhor os jogos.
             */

            if(
                rodada % 2 === 0
            ){

                casa =
                    timeA;

                fora =
                    timeB;

            }

            else{

                casa =
                    timeB;

                fora =
                    timeA;

            }


            jogos.push({

                casa,

                fora,

                jogada:false,

                golsCasa:null,

                golsFora:null

            });

        }


        primeiroTurno.push(
            jogos
        );


        /*
         * Rotação do método do círculo.
         *
         * O primeiro time fica fixo.
         */

        lista=[

            lista[0],

            lista[19],

            ...lista.slice(
                1,
                19
            )

        ];

    }


    /* -----------------------------------------------------
       SEGUNDO TURNO
    ----------------------------------------------------- */

    const segundoTurno =
        primeiroTurno.map(
            jogos =>

                jogos.map(
                    jogo => ({

                        casa:
                            jogo.fora,

                        fora:
                            jogo.casa,

                        jogada:false,

                        golsCasa:null,

                        golsFora:null

                    })
                )

        );


    rodadas=[

        ...primeiroTurno,

        ...segundoTurno

    ];


    /* -----------------------------------------------------
       CALENDÁRIO INDIVIDUAL
    ----------------------------------------------------- */

    calendario =
        rodadas.map(
            (jogos,index)=>{

                const jogo =
                    jogos.find(
                        j =>
                            j.casa ===
                            jogador.clube
                            ||
                            j.fora ===
                            jogador.clube
                    );


                if(!jogo){

                    return {

                        rodada:
                            index+1,

                        adversario:
                            "ERRO",

                        casa:false,

                        jogada:false,

                        golsNosso:null,

                        golsAdversario:null

                    };

                }


                const casa =
                    jogo.casa ===
                    jogador.clube;


                return {

                    rodada:
                        index+1,

                    adversario:
                        casa
                            ?jogo.fora
                            :jogo.casa,

                    casa,

                    jogada:false,

                    golsNosso:null,

                    golsAdversario:null

                };

            }
        );

}

/* =========================================================
   MOTOR DE GOLS
========================================================= */

function gerarGols(
    forcaTime,
    forcaAdv
){

    const diferenca =
        forcaTime -
        forcaAdv;


    /*
     * Quanto maior a diferença,
     * maior a expectativa de gols.
     *
     * O mando dá pequena vantagem.
     */

    let expectativa =
        1.05 +
        diferenca / 24 +
        aleatorio(
            -.70,
            .70
        );


    /*
     * Eventualmente uma partida
     * sai do padrão.
     */

    if(
        Math.random() < .20
    ){

        expectativa +=
            aleatorio(
                -.2,
                1.8
            );

    }


    let gols =
        Math.round(
            expectativa
        );


    gols =
        clamp(
            gols,
            0,
            7
        );


    return gols;

}


/* =========================================================
   CHANCES POR POSIÇÃO
========================================================= */

function chancesPorPosicao(){

    const base={

        gol:.03,

        assistencia:.02

    };


    switch(
        jogador.posicao
    ){

        case "ATA":

            base.gol=.40;

            base.assistencia=.12;

            break;


        case "PE":

        case "PD":

            base.gol=.27;

            base.assistencia=.22;

            break;


        case "MEI":

            base.gol=.16;

            base.assistencia=.30;

            break;


        case "VOL":

            base.gol=.07;

            base.assistencia=.14;

            break;


        case "LE":

        case "LD":

            base.gol=.05;

            base.assistencia=.15;

            break;


        case "ZAG":

            base.gol=.025;

            base.assistencia=.04;

            break;

    }


    const multiplicador =
        .60 +
        jogador.overall /
        100;


    base.gol *=
        multiplicador;

    base.assistencia *=
        multiplicador;


    return base;

}


/* =========================================================
   GERAR PARTICIPAÇÃO EM GOLS
========================================================= */

function gerarParticipacao(
    golsNosso
){

    const chances =
        chancesPorPosicao();

    let gols=0;

    let assists=0;


    for(
        let i=0;
        i<golsNosso;
        i++
    ){

        const r =
            Math.random();


        if(
            r <
            chances.gol
        ){

            gols++;

        }

        else if(
            r <
            chances.gol +
            chances.assistencia
        ){

            assists++;

        }

    }


    gols =
        Math.min(
            gols,
            golsNosso
        );


    assists =
        Math.min(
            assists,
            Math.max(
                0,
                golsNosso -
                gols
            )
        );


    return {

        gols,

        assists

    };

}


/* =========================================================
   GERAR NOTA
========================================================= */

function gerarNota(
    golsNosso,
    golsRival,
    gols,
    assistencias
){

    let nota =
        5.8 +
        (
            jogador.overall -
            50
        ) /
        42;


    nota +=
        gols *
        1.15;


    nota +=
        assistencias *
        .78;


    if(
        golsNosso >
        golsRival
    ){

        nota += .30;

    }

    else if(
        golsNosso <
        golsRival
    ){

        nota -= .20;

    }


    const jogadorDefensivo =
        [

            "ZAG",
            "VOL",
            "LE",
            "LD"

        ].includes(
            jogador.posicao
        );


    if(
        jogadorDefensivo &&
        golsRival === 0
    ){

        nota += .65;

    }


    nota +=
        aleatorio(
            -.6,
            .6
        );


    nota =
        clamp(
            nota,
            4.5,
            10
        );


    return arredondar(
        nota,
        1
    );

}


/* =========================================================
   SIMULAR UM JOGO
========================================================= */

function simularJogo(
    jogo
){

    if(
        jogo.jogada
    ){

        return null;

    }


    const forcaCasa =
        obterForcaClube(
            jogo.casa
        ) +
        3;


    const forcaFora =
        obterForcaClube(
            jogo.fora
        );


    const golsCasa =
        gerarGols(
            forcaCasa,
            forcaFora
        );


    const golsFora =
        gerarGols(
            forcaFora,
            forcaCasa
        );


    jogo.golsCasa =
        golsCasa;


    jogo.golsFora =
        golsFora;


    jogo.jogada =
        true;


    /*
     * PRIMEIRO:
     *
     * atualizamos a tabela
     * para QUALQUER partida.
     */

    atualizarTabela(
        jogo.casa,
        jogo.fora,
        golsCasa,
        golsFora
    );


    /*
     * Se não envolve o jogador,
     * acabamos aqui.
     */

    const eMeuJogo =
        jogo.casa === jogador.clube ||
        jogo.fora === jogador.clube;


    if(
        !eMeuJogo
    ){

        return {

            jogo,

            meuJogo:false

        };

    }


    const golsNosso =
        jogo.casa ===
        jogador.clube

            ?

        golsCasa

            :

        golsFora;


    const golsRival =
        jogo.casa ===
        jogador.clube

            ?

        golsFora

            :

        golsCasa;


    const participacao =
        gerarParticipacao(
            golsNosso
        );


    const nota =
        gerarNota(
            golsNosso,
            golsRival,
            participacao.gols,
            participacao.assists
        );


    const minutos =
        inteiro(
            65,
            90
        );


    /*
     * Atualiza estatísticas individuais.
     */

    jogador.jogos++;

    jogador.gols +=
        participacao.gols;

    jogador.assistencias +=
        participacao.assists;

    jogador.minutos +=
        minutos;

    jogador.somaNotas +=
        nota;


    if(
        golsNosso >
        golsRival
    ){

        jogador.vitorias++;

    }

    else if(
        golsNosso <
        golsRival
    ){

        jogador.derrotas++;

    }

    else{

        jogador.empates++;

    }


    /*
     * Atualiza o calendário do jogador.
     */

    const indice =
        jogador.rodada;


    if(
        calendario[indice]
    ){

        calendario[indice].jogada =
            true;

        calendario[indice].golsNosso =
            golsNosso;

        calendario[indice].golsAdversario =
            golsRival;

    }


    /*
     * Guarda histórico individual.
     */

    jogador.historico.push({

        temporada:
            jogador.temporada,

        rodada:
            indice+1,

        adversario:
            jogo.casa ===
            jogador.clube
                ?jogo.fora
                :jogo.casa,

        casa:
            jogo.casa ===
            jogador.clube,

        golsTime:
            golsNosso,

        golsAdversario:
            golsRival,

        gols:
            participacao.gols,

        assistencias:
            participacao.assists,

        nota,

        minutos

    });


    return {

        jogo,

        meuJogo:true,

        golsCasa,

        golsFora,

        golsJogador:
            participacao.gols,

        assistenciasJogador:
            participacao.assists,

        nota,

        minutos

    };

}


/* =========================================================
   SIMULAR RODADA COMPLETA
========================================================= */

function simularRodadaCompleta(
    mostrarTela=true
){

    const indice =
        jogador.rodada;


    const jogos =
        rodadas[indice];


    if(
        !jogos
    ){

        mostrarFimTemporada();

        return null;

    }


    const resultados=[];


    /*
     * AQUI ESTÁ A CORREÇÃO PRINCIPAL:
     *
     * percorremos TODOS os 10 jogos
     * da rodada.
     */

    for(
        const jogo
        of jogos
    ){

        const resultado =
            simularJogo(
                jogo
            );


        if(
            resultado
        ){

            resultados.push(
                resultado
            );

        }

    }


    /*
     * Reorganiza tabela depois
     * dos 10 jogos.
     */

    ordenarTabela();


    /*
     * Só agora avançamos
     * para a próxima rodada.
     */

    jogador.rodada++;


    ultimaRodadaResultados =
        jogos.map(
            j => ({

                casa:
                    j.casa,

                fora:
                    j.fora,

                golsCasa:
                    j.golsCasa,

                golsFora:
                    j.golsFora,

                meuJogo:
                    j.casa === jogador.clube ||
                    j.fora === jogador.clube

            })
        );


    /*
     * Propostas ocasionais.
     */

    if(
        jogador.jogos > 0 &&
        jogador.jogos % 4 === 0 &&
        Math.random() <
        CONFIG.chancesOfertasDuranteTemporada
    ){

        gerarOfertas();

    }


    salvarAutomaticamente();


    if(
        mostrarTela
    ){

        const meuResultado =
            resultados.find(
                r =>
                    r.meuJogo
            );


        if(
            meuResultado
        ){

            mostrarResultadoRodada(
                meuResultado
            );

        }

        else{

            mostrarHub();

        }

    }


    return resultados;

}


/* =========================================================
   BOTÃO SIMULAR PARTIDA
========================================================= */

function simularPartida(){

    simularRodadaCompleta(

    );

}


/* =========================================================

========================================================= */

function simularTemporada(){

    if(
        jogador.rodada >=
        rodadas.length
    ){

        mostrarFimTemporada();

        return;

    }


    document.getElementById(
        "app"
    ).innerHTML=`

        <div class="panel loading">

            <div>

                <div class="spinner"></div>

                <p class="muted center">

                    Simulando todas as partidas
                    restantes...

                </p>

            </div>

        </div>

    `;


    setTimeout(
        ()=>{

            while(
                jogador.rodada <
                rodadas.length
            ){

                simularRodadaCompleta(
                    false
                );

            }


            mostrarFimTemporada();

        },
        80
    );

}

function calcularArtilhariaSimulada(){

    const ranking=[];


    /*
     * Nesta fase, os outros clubes
     * ainda não possuem elencos reais.
     *
     * Então criamos uma referência
     * estatística baseada na força do clube.
     *
     * O jogador do save recebe os
     * seus gols reais.
     */

    tabela.forEach(
        time=>{

            const jogos =
                Math.max(
                    1,
                    time.jogos
                );


            const forca =
                obterForcaClube(
                    time.clube
                );


            const estimativa =
                Math.max(
                    0,
                    Math.round(

                        (
                            forca -
                            55
                        )

                        *

                        jogos /
                        20

                        +

                        aleatorio(
                            -2,
                            4
                        )

                    )
                );


            ranking.push({

                nome:
                    "Artilheiro de " +
                    time.clube,

                clube:
                    time.clube,

                gols:
                    estimativa,

                meu:
                    false

            });

        }
    );


    ranking.push({

        nome:
            jogador.nome,

        clube:
            jogador.clube,

        gols:
            jogador.gols,

        meu:
            true

    });


    return ranking
        .sort(
            (a,b)=>
                b.gols-a.gols
        )
        .slice(
            0,
            20
        );

}

========================================================= */

function gerarOfertas(){

    ofertasTransferencia=[];


    const candidatos =
        obterTodosClubes()
        .filter(
            clube =>
                clube !==
                jogador.clube
        );


    /*
     * Quanto melhor o jogador,
     * mais clubes fortes podem
     * aparecer.
     */

    const candidatosFiltrados =
        candidatos.filter(
            clube => {

                const forca =
                    obterForcaClube(
                        clube
                    );


                const atual =
                    obterForcaClube(
                        jogador.clube
                    );


                if(
                    forca >
                    jogador.overall +
                    18
                ){

                    return (
                        Math.random() <
                        .25
                    );

                }


                if(
                    forca >
                    atual +
                    12
                ){

                    return (
                        jogador.overall >=
                        forca-12
                        ||
                        Math.random()<.35
                    );

                }


                return true;

            }
        );


    const quantidade =
        Math.min(
            CONFIG.maxOfertas,
            inteiro(
                1,
                2
            )
        );


    const escolhidos =
        embaralhar(
            candidatosFiltrados
        )
        .slice(
            0,
            quantidade
        );


    escolhidos.forEach(
        clube => {

            const forca =
                obterForcaClube(
                    clube
                );


            let valor =
                500000

                +

                jogador.overall *
                160000

                +

                inteiro(
                    0,
                    2000000
                );


            if(
                forca >
                obterForcaClube(
                    jogador.clube
                )
            ){

                valor +=
                    1500000;

            }


            ofertasTransferencia.push({

                clube,

                valor,

                forca

            });

        }
    );

}

/* =========================================================

========================================================= */

function aceitarTransferencia(
    index
){

    const oferta =
        ofertasTransferencia[
            index
        ];


    if(
        !oferta
    ){

        return;

    }


    const antigo =
        jogador.clube;


    const informacao =
        obterLigaDoClube(
            oferta.clube
        );


    /*
     * O país de nascimento
     * continua sendo o mesmo.
     *
     * A liga atual passa a ser
     * a liga do novo clube.
     */

    jogador.clube =
        oferta.clube;


    jogador.liga =
        informacao.nome;


    jogador.paisClube =
        informacao.pais;


    jogador.valorMercado =
        oferta.valor;


    jogador.transferencias.push({

        temporada:
            jogador.temporada,

        rodada:
            jogador.rodada,

        de:
            antigo,

        para:
            oferta.clube,

        valor:
            oferta.valor

    });


    ofertasTransferencia=[];


    /*
     * Para deixar a transferência
     * funcionando de forma simples,
     * o novo campeonato começa
     * sua própria contagem.
     */

    jogador.rodada=0;


    criarTabela();

    criarCalendario();


    salvarAutomaticamente();


    mostrarToast(

        "✅ Transferência concluída para " +
        oferta.clube

    );


    mostrarHub();

}

/* =========================================================
   RESUMO DA TEMPORADA
========================================================= */

function resumirTemporada(){

    const partidas =
        jogador.historico.filter(
            h =>
                h.temporada ===
                jogador.temporada
        );


    const jogos =
        partidas.length;


    const gols =
        partidas.reduce(
            (s,h) =>
                s+h.gols,
            0
        );


    const assistencias =
        partidas.reduce(
            (s,h) =>
                s+h.assistencias,
            0
        );


    const somaNotas =
        partidas.reduce(
            (s,h) =>
                s+h.nota,
            0
        );


    const nota =
        jogos
            ?arredondar(
                somaNotas/
                jogos,
                2
            )
            :0;


    return {

        temporada:
            jogador.temporada,

        clube:
            jogador.clube,

        jogos,

        gols,

        assistencias,

        nota

    };

}


/* =========================================================
   REGISTRAR TEMPORADA
========================================================= */

function registrarHistoricoTemporada(){

    const jaExiste =
        jogador.historicoTemporadas
        .some(
            x =>
                x.temporada ===
                jogador.temporada
        );


    if(
        jaExiste
    ){

        return;

    }


    const resumo =
        resumirTemporada();


    jogador.historicoTemporadas.push(
        resumo
    );


    if(
        !jogador.melhorTemporada ||
        (
            resumo.gols +
            resumo.assistencias
        )
        >
        (
            jogador.melhorTemporada.gols +
            jogador.melhorTemporada.assistencias
        )
    ){

        jogador.melhorTemporada={
            ...resumo
        };

    }

}
