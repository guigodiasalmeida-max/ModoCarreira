<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAREER MODE — Programa Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* =========================================================
   TOKENS
========================================================= */
:root{
    --paper:#F1E7D3;
    --paper2:#E7DAC0;
    --paper3:#DFCFAE;
    --ink:#16241B;
    --ink-soft:#3C4A3F;
    --pitch:#193C28;
    --pitch2:#123020;
    --pitch3:#0D2419;
    --gold:#C79A2E;
    --gold-light:#E4C465;
    --brick:#A63D3D;
    --brick-light:#C96A6A;
    --line:#C9B693;
    --white:#FBF6EA;
    --shadow:0 18px 50px rgba(13,20,15,.28);
    --radius:14px;
}

*{box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',Arial,sans-serif;
}

h1,h2,h3,.display{
    font-family:'Fraunces',Georgia,serif;
    margin:0;
}

button,input,select{font:inherit;}

button{
    border:0;
    cursor:pointer;
    background:none;
    color:inherit;
}

button:disabled{opacity:.4;cursor:not-allowed;}

.app{
    width:min(1180px,100%);
    margin:0 auto;
    padding:22px;
}

/* =========================================================
   PRIMITIVOS
========================================================= */

.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}
.center{text-align:center;}
.muted{color:var(--ink-soft);}
.small{font-size:12.5px;}
.spacer{height:16px;}
.grow{flex:1;}

.eyebrow{
    font-size:11.5px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.4px;
}

.card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.card-dark{
    background:linear-gradient(175deg,var(--pitch) 0%,var(--pitch3) 100%);
    color:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06);
}

.card-body{padding:22px;}
.card-body.tight{padding:16px;}

.hairline{
    border:0;
    border-top:1px dashed var(--line);
    margin:16px 0;
}

.hairline.on-dark{border-top:1px dashed rgba(255,255,255,.18);}

/* =========================================================
   BOTÕES — estilo "canhoto de ingresso"
========================================================= */

.btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 22px;
    border-radius:11px;
    background:var(--gold);
    color:var(--pitch3);
    font-weight:700;
    letter-spacing:.2px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 0 #8f7220;
}

.btn:hover:not(:disabled){transform:translateY(-2px);}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 3px 0 #8f7220;}

.btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    box-shadow:none;
}

.btn.ghost.on-dark{color:var(--paper);border-color:rgba(255,255,255,.5);}

.btn.brick{background:var(--brick);color:var(--white);box-shadow:0 6px 0 #6f2626;}
.btn.brick:active:not(:disabled){box-shadow:0 3px 0 #6f2626;}

.btn.small{padding:10px 16px;font-size:13px;box-shadow:0 4px 0 #8f7220;}

.btn-stub::after{
    content:"";
    width:1px;
    align-self:stretch;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.35) 0 4px,transparent 4px 9px);
    margin-left:2px;
}

/* =========================================================
   HOME
========================================================= */

.hero{
    min-height:88vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 0;
}

.hero-inner{
    width:min(760px,100%);
    text-align:center;
    color:var(--paper);
    background:radial-gradient(ellipse at 50% -10%,rgba(199,154,46,.18),transparent 60%),
               linear-gradient(180deg,var(--pitch) 0%,var(--pitch3) 100%);
    border-radius:20px;
    padding:56px 32px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06);
}

.hero .kicker{
    display:inline-block;
    padding:6px 14px;
    border:1px solid rgba(228,196,101,.5);
    border-radius:999px;
    color:var(--gold-light);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.5px;
}

.hero h1{
    font-size:clamp(42px,8vw,74px);
    line-height:.98;
    margin:22px 0 0;
    letter-spacing:-1.5px;
}

.hero h1 em{
    font-style:normal;
    color:var(--gold-light);
}

.hero p{
    max-width:520px;
    margin:20px auto 30px;
    color:#CFE0D2;
    line-height:1.6;
    font-size:16.5px;
}

/* =========================================================
   FORMULÁRIO DE CRIAÇÃO
========================================================= */

.form-box{width:min(640px,100%);margin:30px auto;}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}

.field label{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.4px;
    color:var(--ink-soft);
}

.input,.select{
    width:100%;
    padding:14px 15px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
}

.input:focus,.select:focus{border-color:var(--gold);}

.pos-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.pos{
    padding:16px 8px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    text-align:center;
    transition:.15s;
}

.pos:hover,.pos.on{
    border-color:var(--gold);
    background:var(--paper2);
    transform:translateY(-2px);
}

.pos .sig{font-family:'Fraunces',serif;font-size:22px;font-weight:900;}
.pos .nm{margin-top:4px;font-size:10.5px;color:var(--ink-soft);}

/* =========================================================
   FICHA DO JOGADOR
========================================================= */

.attrs-layout{
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:16px;
    align-items:start;
}

.player-sheet{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    position:relative;
    overflow:hidden;
}

.player-sheet::before{
    content:"FICHA DE ATLETA";
    position:absolute;
    top:14px;right:-38px;
    background:var(--gold);
    color:var(--pitch3);
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    padding:4px 42px;
    transform:rotate(35deg);
}

.p-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;}
.p-name{font-size:28px;font-weight:800;letter-spacing:-.5px;}

.p-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.pill{
    padding:6px 11px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
}

.pill.gold{background:var(--gold);border-color:var(--gold);color:var(--pitch3);}

.ovr-box{
    min-width:94px;
    padding:10px 14px;
    border-radius:14px;
    background:var(--pitch);
    color:var(--paper);
    text-align:center;
}
.ovr-label{display:block;font-size:10px;letter-spacing:1px;color:var(--gold-light);font-weight:700;}
.ovr-num{display:block;font-family:'Fraunces',serif;font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;}

.attr-list{display:grid;gap:9px;margin-top:18px;}

.attr{
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
}

.attr-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13.5px;}
.attr-top b{font-weight:700;}
.attr-top span{font-weight:800;color:var(--pitch);font-variant-numeric:tabular-nums;}

.bar{width:100%;height:7px;border-radius:999px;background:var(--paper3);overflow:hidden;}
.bar > div{height:100%;background:linear-gradient(90deg,var(--pitch),var(--gold));border-radius:inherit;}

/* =========================================================
   ROLETA
========================================================= */

.roulette-wrap{
    max-width:560px;
    margin:0 auto;
    text-align:center;
    color:var(--paper);
}

.roulette-ring{
    width:200px;height:200px;
    margin:22px auto;
    border-radius:50%;
    background:conic-gradient(var(--gold),var(--pitch2),var(--gold-light),var(--pitch2),var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 10px rgba(228,196,101,.08), 0 25px 60px rgba(0,0,0,.4);
}

.roulette-core{
    width:158px;height:158px;
    border-radius:50%;
    background:var(--pitch3);
    border:1px solid rgba(255,255,255,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px;
    text-align:center;
}

.roulette-icon{font-size:30px;}

.roulette-name{
    margin-top:8px;
    max-width:135px;
    font-size:20px;
    font-weight:800;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.spinning{animation:pulse .3s infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.045);}}

.tag-rarity{
    display:inline-block;
    margin-top:14px;
    padding:5px 13px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
}
.tag-comum{background:#3E5347;color:#DCE9DF;}
.tag-raro{background:var(--gold);color:var(--pitch3);}
.tag-lendario{background:linear-gradient(90deg,#E4C465,#C79A2E);color:#2A1F04;box-shadow:0 0 14px rgba(228,196,101,.5);}

.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;}

.choice{
    padding:16px 8px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:var(--paper);
    transition:.15s;
}
.choice:hover{background:rgba(228,196,101,.14);border-color:var(--gold-light);transform:translateY(-2px);}
.choice span{display:block;font-size:11.5px;color:#BFD1C2;margin-bottom:5px;}
.choice strong{font-size:22px;color:var(--gold-light);}

/* =========================================================
   HUB / DASHBOARD
========================================================= */

.hub-head{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
}

.club-strip{
    display:flex;align-items:center;gap:12px;
}

.badge-club{
    width:46px;height:46px;border-radius:10px;
    background:var(--gold);color:var(--pitch3);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:900;font-size:17px;
}

.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin:18px 0 4px;
}
.tab{
    padding:10px 15px;
    border-radius:999px;
    background:var(--paper2);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    flex:none;
}
.tab.on{background:var(--pitch);color:var(--paper);}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}
.stat-box{
    padding:16px;
    border-radius:12px;
    background:var(--paper2);
    border:1px solid var(--line);
    text-align:center;
}
.stat-num{font-family:'Fraunces',serif;font-size:26px;font-weight:800;color:var(--pitch);}
.stat-lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;margin-top:3px;}

.table-wrap{overflow-x:auto;}
table.league{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
table.league th{
    text-align:left;padding:9px 8px;color:var(--ink-soft);font-size:10.5px;
    letter-spacing:.4px;border-bottom:1.5px solid var(--ink);
}
table.league td{padding:9px 8px;border-bottom:1px solid var(--line);}
table.league tr.me{background:rgba(199,154,46,.14);font-weight:700;}
table.league td.center,table.league th.center{text-align:center;}

.notice{
    padding:14px;border-radius:10px;
    background:var(--paper2);border:1px dashed var(--line);
    font-size:13.5px;
}
.notice.gold{background:rgba(199,154,46,.15);border-color:var(--gold);}
.notice.brick{background:rgba(166,61,61,.12);border-color:var(--brick);}

.timeline{display:flex;flex-direction:column;gap:10px;}
.tl-item{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);
}
.tl-icon{font-size:18px;}
.tl-title{font-weight:700;font-size:13.5px;}
.tl-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

.offer-card{
    padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}

.train-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);
}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{
    width:30px;height:30px;border-radius:8px;background:var(--pitch);color:var(--paper);font-weight:800;
}
.stepper span{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;}

.chart-wrap{width:100%;overflow-x:auto;}

/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width:1000px){
    .app{padding:16px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:680px){
    body{overflow-x:hidden;}
    .app{padding:12px;}
    .hero-inner{padding:38px 18px;}
    .attrs-layout{grid-template-columns:1fr;}
    .pos-grid{grid-template-columns:repeat(3,1fr);}
    .choice-grid{grid-template-columns:repeat(2,1fr);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .p-name{font-size:22px;}
    .ovr-num{font-size:30px;}
    .card-body{padding:16px;}
    .btn{width:100%;justify-content:center;}
    .offer-card{flex-direction:column;align-items:stretch;text-align:center;}
}

</style>
</head>

];

const CONFIG = {

};

const NOMES_ATRIBUTOS = {

};

/* =========================================================
   2) ESTADO
========================================================= */

let jogador = null;
let jogadoresDisponiveis = [];

let tabela = [];

/* =========================================================
   3) UTILITÁRIOS

function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function rnd(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function escapeHTML(s){
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
}
function embaralhar(arr){
    const c = arr.slice();
    for(let i=c.length-1;i>0;i--){
        const j = rndInt(0,i);
        [c[i],c[j]] = [c[j],c[i]];
    }
    return c;
}
function moeda(v){
    return "R$ " + Math.round(v).toLocaleString("pt-BR");
}
function poisson(lambda){
    lambda = Math.max(0.05,lambda);
    const L = Math.exp(-lambda);
    let k=0, p=1;
    do{ k++; p*=Math.random(); }while(p>L);
    return k-1;

function gerarClubes(){

// Método do círculo pra turno e returno com N times (N par).
function gerarCalendario(nomes){
    const lista = nomes.slice();
    if(lista.length % 2 !== 0) lista.push("BYE");
    const n = lista.length;
    const rodadasTurno = [];
    const fixos = lista.slice(1);
    let rot = fixos.slice();
    for(let r=0;r<n-1;r++){
        const mesa = [lista[0], ...rot];
        const jogos = [];
        for(let i=0;i<n/2;i++){
            const a = mesa[i], b = mesa[n-1-i];
            if(a!=="BYE" && b!=="BYE") jogos.push(r%2===0?[a,b]:[b,a]);
        }
        rodadasTurno.push(jogos);
        rot.unshift(rot.pop());
    }
    const returno = rodadasTurno.map(r=>r.map(([a,b])=>[b,a]));
    return [...rodadasTurno, ...returno];
}

function tabelaVazia(nomes){
    return nomes.map(nome=>({
        clube:nome, pontos:0, jogos:0, vitorias:0, empates:0, derrotas:0,
        golsPro:0, golsContra:0
    }));
}

function forcaClube(nome){
    const c = clubes.find(c=>c.nome===nome);
    return c ? c.forca : 70;
}

function atualizarTabela(nomeA,nomeB,golsA,golsB){
    const ta = tabela.find(t=>t.clube===nomeA);
    const tb = tabela.find(t=>t.clube===nomeB);
    [ [ta,golsA,golsB], [tb,golsB,golsA] ].forEach(([t,gf,gc])=>{
        t.jogos++; t.golsPro+=gf; t.golsContra+=gc;
        if(gf>gc){ t.vitorias++; t.pontos+=3; }
        else if(gf===gc){ t.empates++; t.pontos+=1; }
        else{ t.derrotas++; }
    });
}

function tabelaOrdenada(){
    return tabela.slice().sort((a,b)=>{
        if(b.pontos!==a.pontos) return b.pontos-a.pontos;
        const sa = a.golsPro-a.golsContra, sb = b.golsPro-b.golsContra;
        if(sb!==sa) return sb-sa;
        return b.golsPro-a.golsPro;
    });
}

function pesoJogador(p){
    const overall = p.overall;
    let peso = overall>=90 ? 0.7 : overall>=75 ? 3 : 8; // raridade base
    const chave = posicaoInfo(jogador.posicao).atributoChave;
    peso *= 1 + Math.max(0,(p[chave]-55))/45; // sinergia de posição
    return peso;
}

function sortearPonderado(lista){
    const pesos = lista.map(pesoJogador);
    const total = pesos.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<lista.length;i++){
        r -= pesos[i];
        if(r<=0) return lista[i];
    }
    return lista[lista.length-1];
}

    if(contarAtributos()>=6) return;
    if(!jogadoresDisponiveis.length){ alert("Acabaram os jogadores disponíveis."); return; }

function viewHistorico(){
    if(!jogador.historicoTemporadas.length) return `<div class="notice">Nenhuma temporada concluída ainda.</div>`;
    const w = 560, h = 160, pad = 24;
    const overalls = jogador.historicoTemporadas.map(t=>t.overallFinal);
    const min = Math.min(...overalls,jogador.overall)-3, max = Math.max(...overalls,jogador.overall)+3;
    const pts = overalls.map((v,i)=>{
        const x = pad + i*((w-pad*2)/Math.max(1,overalls.length-1));
        const y = h-pad - ((v-min)/(max-min||1))*(h-pad*2);
        return `${x},${y}`;
    }).join(" ");
    const eventos = jogador.eventos.slice(-10).reverse().map(e=>`
        <div class="tl-item"><div class="tl-icon">${e.icone}</div><div><div class="tl-title">${escapeHTML(e.titulo)}</div><div class="tl-sub">${escapeHTML(e.sub)}</div></div></div>
    `).join("");
    return `
        <div class="card"><div class="card-body">
            <h3 style="font-size:17px;">Evolução do overall</h3>
            <div class="chart-wrap">
                <svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;">
                    <polyline points="${pts}" fill="none" stroke="#C79A2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div></div>
        <div class="spacer"></div>
        <div class="card"><div class="card-body">
            <h3 style="font-size:17px;">Linha do tempo</h3>
            <div class="spacer"></div>
            <div class="timeline">${eventos || `<div class="notice">Sem eventos recentes.</div>`}</div>
        </div></div>
    `;
}

function viewTreino(){
    return `
        <div class="card"><div class="card-body">
            <div class="row between">
                <h3 style="font-size:17px;">Treino</h3>
                <span class="pill gold">${jogador.pontosTreino} ponto(s) disponível(is)</span>
            </div>
            <p class="small muted">Ganhe pontos ao final de cada temporada, conforme seu desempenho, e invista no atributo que quiser (máx. 99).</p>
            <div class="spacer"></div>
            <div class="stack">
                ${CONFIG.atributosChave.map(k=>`
                    <div class="train-row">
                        <div><b>${NOMES_ATRIBUTOS[k]}</b><div class="small muted">Atual: ${jogador[k]}</div></div>
                        <div class="stepper">
                            <button onclick="treinarAtributo('${k}')" ${jogador.pontosTreino<=0 || jogador[k]>=99 ? "disabled" : ""}>+1</button>
                        </div>
                    </div>
                `).join("")}
            </div>
        </div></div>
    `;
}
function treinarAtributo(chave){
    if(jogador.pontosTreino<=0 || jogador[chave]>=99) return;
    jogador[chave] = clamp(jogador[chave]+1,0,99);
    jogador.pontosTreino--;
    jogador.overall = calcularOverall(jogador);
    salvarAutomaticamente();
    mostrarHub();
}

function viewSelecao(){
    return `
        <div class="card"><div class="card-body">
            <h3 style="font-size:17px;">Seleção de ${jogador.pais}</h3>
            <div class="spacer"></div>
            ${jogador.selecaoConvocado
                ? `<div class="stat-grid">
                     <div class="stat-box"><div class="stat-num">${jogador.selecaoJogos}</div><div class="stat-lbl">JOGOS</div></div>
                     <div class="stat-box"><div class="stat-num">${jogador.selecaoGols}</div><div class="stat-lbl">GOLS</div></div>
                   </div>`
                : `<div class="notice">Você ainda não foi convocado. Mantenha o overall alto e o desempenho consistente pra chamar atenção do técnico.</div>`
            }
        </div></div>
    `;
}

function viewFinancas(){
    return `
        <div class="card"><div class="card-body">
            <div class="stat-grid">
                <div class="stat-box"><div class="stat-num">${moeda(jogador.dinheiro)}</div><div class="stat-lbl">SALDO</div></div>
                <div class="stat-box"><div class="stat-num">${moeda(jogador.valorMercado)}</div><div class="stat-lbl">VALOR DE MERCADO</div></div>
            </div>
            <div class="spacer"></div>
            <p class="small muted">Você recebe patrocínio automaticamente ao final de cada temporada, proporcional ao seu overall e desempenho.</p>
        </div></div>
        ${ofertaAtual ? `<div class="spacer"></div>${viewOferta()}` : ""}

            <div class="spacer"></div>
            <div class="stack">
                ${jogador.transferencias.length ? jogador.transferencias.map(t=>`
                    <div class="notice">💰 ${t.temporada}: ${escapeHTML(t.de)} → ${escapeHTML(t.para)} por ${moeda(t.valor)}</div>

}

function viewOferta(){
    return `
        <div class="offer-card">
            <div>
                <b>Proposta de ${escapeHTML(ofertaAtual.clube)}</b>
                <div class="small muted">Valor: ${moeda(ofertaAtual.valor)}</div>
            </div>
            <div class="row">
                <button class="btn small" onclick="aceitarOferta()">Aceitar</button>
                <button class="btn small ghost" onclick="recusarOferta()">Recusar</button>
            </div>
        </div>
    `;
}
function aceitarOferta(){
    const de = jogador.clube;
    jogador.transferencias.push({ temporada:jogador.temporada, de, para:ofertaAtual.clube, valor:ofertaAtual.valor });
    jogador.dinheiro += ofertaAtual.valor;
    jogador.clube = ofertaAtual.clube;
    jogador.eventos.push({icone:"💰",titulo:"Transferência confirmada",sub:`${de} → ${ofertaAtual.clube} por ${moeda(ofertaAtual.valor)}`});
    ofertaAtual = null;
    salvarAutomaticamente();
    toast("Transferência concluída!");
    mostrarHub();
}
function recusarOferta(){ ofertaAtual = null; mostrarHub(); }

function viewCompartilhar(){
    const texto = `⚽ ${jogador.nome} — Career Mode\n`+
        `${jogador.clube} · OVR ${jogador.overall} · ${jogador.pais}\n`+
        `Temporada ${jogador.temporada} · ${jogador.jogos} jogos · ${jogador.gols} gols · ${jogador.assistencias} assistências\n`+
        `Maior overall: ${jogador.maiorOverall} · Prêmios: ${jogador.premios.length}`;
    return `
        <div class="card-dark"><div class="card-body">
            <span class="eyebrow" style="color:var(--gold-light)">RESUMO DE CARREIRA</span>
            <h2 style="font-size:26px;margin-top:8px;">${escapeHTML(jogador.nome)}</h2>
            <p class="muted" style="color:#CFE0D2;white-space:pre-line;">${escapeHTML(texto)}</p>
            <button class="btn" onclick="copiarResumo()">📋 Copiar resumo</button>
        </div></div>
    `;
}
function copiarResumo(){
    const texto = `⚽ ${jogador.nome} — Career Mode\n${jogador.clube} · OVR ${jogador.overall} · ${jogador.pais}\nTemporada ${jogador.temporada} · ${jogador.jogos} jogos · ${jogador.gols} gols · ${jogador.assistencias} assistências\nMaior overall: ${jogador.maiorOverall} · Prêmios: ${jogador.premios.length}`;
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto).then(()=>toast("Resumo copiado!")).catch(()=>alert(texto));
    } else {
        alert(texto);
    }
}

/* =========================================================
   10) SIMULAÇÃO DE PARTIDA
========================================================= */

function chanceLesao(){
    return clamp(0.05 - jogador.resistencia/2200, 0.012, 0.07);
}

function jogarRodada(){
    if(jogador.rodada>=calendario.length) return;

    const jaEstavaLesionado = jogador.lesaoRestante>0;

    const jogos = calendario[jogador.rodada];
    const meuJogo = jogos.find(([a,b])=>a===jogador.clube||b===jogador.clube);

    // simula os outros confrontos da rodada
    jogos.forEach(([a,b])=>{
        if(meuJogo && a===meuJogo[0] && b===meuJogo[1]) return;
        const ga = poisson(0.6+(forcaClube(a)-60)/40);
        const gb = poisson(0.6+(forcaClube(b)-60)/40);
        atualizarTabela(a,b,ga,gb);
    });

    let resumoHTML = "";

    if(meuJogo && jaEstavaLesionado){
        // time joga sem o jogador — ele só assiste do banco
        const souA = meuJogo[0]===jogador.clube;
        const meuClube = souA?meuJogo[0]:meuJogo[1];
        const adversario = souA?meuJogo[1]:meuJogo[0];
        const ga = poisson(0.6+(forcaClube(meuClube)-68)/40);
        const gb = poisson(0.6+(forcaClube(adversario)-60)/40);
        atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?ga:gb, souA?gb:ga);
        jogador.lesaoRestante--;
        resumoHTML = `
            <h3 style="font-size:17px;">${meuClube} ${souA?ga:gb} x ${souA?gb:ga} ${adversario}</h3>
            <p class="small muted">🩹 Você ficou de fora se recuperando. ${jogador.lesaoRestante>0?`Faltam ${jogador.lesaoRestante} rodada(s).`:"Você está liberado pra próxima rodada!"}</p>
        `;
    } else if(meuJogo){
        const souA = meuJogo[0]===jogador.clube;
        const meuClube = souA?meuJogo[0]:meuJogo[1];
        const adversario = souA?meuJogo[1]:meuJogo[0];

        if(Math.random() < chanceLesao()){
            jogador.lesaoRestante = rndInt(1,3);
            const ga = poisson(0.6+(forcaClube(meuClube)-65)/40);
            const gb = poisson(0.6+(forcaClube(adversario)-60)/40);
            atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?ga:gb, souA?gb:ga);
            jogador.eventos.push({icone:"🩹",titulo:"Lesão",sub:`Fora por ${jogador.lesaoRestante} rodada(s).`});
            resumoHTML = `<div class="notice brick">🩹 Você se lesionou durante a partida e ficará de fora por ${jogador.lesaoRestante} rodada(s).</div>`;
        } else {
            const pos = posicaoInfo(jogador.posicao);
            const golsJogador = poisson(pos.fatorGol * (jogador.finalizacao/70) * (jogador.overall/78));
            const assistJogador = poisson(pos.fatorAss * (jogador.passe/70) * (jogador.overall/78));
            const golsTimeExtra = poisson(0.9+(forcaClube(meuClube)-70)/40);
            const golsAdv = poisson(0.9+(forcaClube(adversario)-65)/40);
            const meusGols = golsJogador + golsTimeExtra;

            atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?meusGols:golsAdv, souA?golsAdv:meusGols);

            let nota = 6.0 + golsJogador*0.7 + assistJogador*0.5 + rnd(-0.3,0.3);
            if(meusGols>golsAdv) nota += 0.2; else if(meusGols<golsAdv) nota -= 0.25;
            nota = clamp(nota,3,10);

            jogador.jogos++; jogador.gols+=golsJogador; jogador.assistencias+=assistJogador; jogador.somaNotas+=nota;
            if(meusGols>golsAdv) jogador.vitorias++;
            else if(meusGols===golsAdv) jogador.empates++;
            else jogador.derrotas++;

            resumoHTML = `
                <h3 style="font-size:17px;">${meuClube} ${meusGols} x ${golsAdv} ${adversario}</h3>
                <p class="small muted">Sua nota: <b>${nota.toFixed(1)}</b> · Gols: ${golsJogador} · Assistências: ${assistJogador}</p>
            `;
        }
    } else {
        resumoHTML = `<div class="notice">Você não jogou esta rodada (fora do calendário do seu clube).</div>`;
    }

    jogador.rodada++;
    // se o jogador não tem partida nesta rodada (calendário ímpar/folga) mas está lesionado, o tempo de recuperação continua passando
    if(!meuJogo && jogador.lesaoRestante>0) jogador.lesaoRestante--;

    // chance de proposta de transferência (só se tiver bom desempenho e não tiver oferta pendente)
    if(!ofertaAtual && jogador.overall>=72 && Math.random()<0.05){
        const candidatos = clubes.filter(c=>c.nome!==jogador.clube);
        const clube = candidatos[rndInt(0,candidatos.length-1)];
        ofertaAtual = { clube: clube.nome, valor: Math.round(jogador.valorMercado*rnd(0.9,1.6)) };
        jogador.eventos.push({icone:"📩",titulo:"Proposta recebida",sub:`${clube.nome} — ${moeda(ofertaAtual.valor)}`});
    }

    // convocação pra seleção
    if(!jogador.selecaoConvocado && jogador.overall>=80 && Math.random()<0.08){
        jogador.selecaoConvocado = true;
        jogador.eventos.push({icone:"🌎",titulo:"Convocado!",sub:`Chamado pela seleção de ${jogador.pais}.`});
        toast("🌎 Você foi convocado pra seleção!");
    } else if(jogador.selecaoConvocado && Math.random()<0.2){
        jogador.selecaoJogos++;
        const g = poisson(0.3*(jogador.overall/85));
        jogador.selecaoGols += g;
    }

    jogador.valorMercado = Math.round(jogador.valorMercado*1.01 + jogador.overall*300);
    ultimoResultado = resumoHTML;
    salvarAutomaticamente();
    mostrarHub();
}

function simularTemporadaRapido(){
    while(jogador.rodada<calendario.length){
        jogarRodada();
    }
    mostrarHub();
}

/* =========================================================
   11) FIM DE TEMPORADA
========================================================= */

function finalizarTemporada(){
    const media = jogador.jogos ? jogador.somaNotas/jogador.jogos : 0;

    // patrocínio
    const patrocinio = Math.round(jogador.overall*8000 + media*4000);
    jogador.dinheiro += patrocinio;

    // pontos de treino
    const pontosGanhos = 2 + Math.round(media>=7?2:media>=6?1:0);
    jogador.pontosTreino += pontosGanhos;

    // prêmios
    const premiosTemporada = [];
    const rivalGols = rndInt(6,22);
    if(jogador.gols>rivalGols){ premiosTemporada.push("Artilheiro da Liga"); jogador.premios.push({temporada:jogador.temporada,titulo:"Artilheiro da Liga"}); }
    if(media>=7.6){ premiosTemporada.push("Craque da Temporada"); jogador.premios.push({temporada:jogador.temporada,titulo:"Craque da Temporada"}); }

    // envelhecimento
    let declinioTxt = "";
    if(jogador.idade>=30){
        ["velocidade","resistencia","forca"].forEach(k=>{
            const queda = rndInt(1,3);
            jogador[k] = clamp(jogador[k]-queda,40,99);
        });
        jogador.overall = calcularOverall(jogador);
        declinioTxt = "A idade começou a cobrar seu preço fisicamente.";
    }

    jogador.historicoTemporadas.push({
        temporada:jogador.temporada, overallFinal:jogador.overall, jogos:jogador.jogos,
        gols:jogador.gols, assistencias:jogador.assistencias, media:Number(media.toFixed(2)),
        premios:premiosTemporada
    });

    jogador.eventos.push({icone:"📅",titulo:`Fim da temporada ${jogador.temporada}`,sub:`${jogador.gols} gols, nota média ${media.toFixed(2)}`});

    const posicaoFinal = tabelaOrdenada().findIndex(t=>t.clube===jogador.clube)+1;

    app().innerHTML = `
        <div class="card-dark"><div class="card-body center">
            <span class="eyebrow" style="color:var(--gold-light)">📋 RESUMO DA TEMPORADA ${jogador.temporada}</span>
            <h2 style="font-size:30px;margin-top:10px;">${jogador.clube} terminou em ${posicaoFinal}º lugar</h2>
            <div class="spacer"></div>
            <div class="stat-grid">
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.gols}</div><div class="stat-lbl" style="color:#BFD1C2;">GOLS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.assistencias}</div><div class="stat-lbl" style="color:#BFD1C2;">ASSISTÊNCIAS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${media.toFixed(2)}</div><div class="stat-lbl" style="color:#BFD1C2;">NOTA MÉDIA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${moeda(patrocinio)}</div><div class="stat-lbl" style="color:#BFD1C2;">PATROCÍNIO</div></div>
            </div>
            <div class="spacer"></div>
            ${premiosTemporada.length ? `<div class="notice gold">🏆 ${premiosTemporada.join(" · ")}</div>` : ""}
            ${declinioTxt ? `<div class="spacer"></div><div class="notice brick">⚠️ ${declinioTxt}</div>` : ""}
            <div class="spacer"></div>
            <div class="notice" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);">🎯 Você ganhou <b>${pontosGanhos} ponto(s) de treino</b> pra investir nos atributos.</div>
            <div class="spacer"></div>
            <button class="btn" onclick="proximaTemporada()">Iniciar temporada ${jogador.temporada+1} →</button>
        </div></div>
    `;
}

function proximaTemporada(){
    jogador.idade++;
    jogador.temporada++;
    jogador.rodada = 0;
    jogador.jogos=0; jogador.gols=0; jogador.assistencias=0; jogador.somaNotas=0;
    jogador.vitorias=0; jogador.empates=0; jogador.derrotas=0;
    jogador.maiorOverall = Math.max(jogador.maiorOverall,jogador.overall);
    calendario = gerarCalendario(clubes.map(c=>c.nome));
    tabela = tabelaVazia(clubes.map(c=>c.nome));
    ultimoResultado = null;
    salvarAutomaticamente();
    mostrarHub();
}

/* =========================================================
   12) APOSENTADORIA
========================================================= */

function aposentarJogador(){
    if(!confirm("Tem certeza que quer se aposentar? Isso encerra a carreira atual.")) return;
    jogador.aposentado = true;
    salvarAutomaticamente();
    mostrarAposentadoria();
}

function mostrarAposentadoria(){
    const media = jogador.jogos ? (jogador.somaNotas/jogador.jogos).toFixed(2) : "—";
    app().innerHTML = `
        <div class="card-dark"><div class="card-body center">
            <span class="eyebrow" style="color:var(--gold-light)">🏁 CARREIRA ENCERRADA</span>
            <h2 style="font-size:32px;margin-top:10px;">${escapeHTML(jogador.nome)}</h2>
            <p class="muted" style="color:#CFE0D2;">${jogador.temporada} temporada(s) · Maior overall: ${jogador.maiorOverall}</p>
            <div class="spacer"></div>
            <div class="stat-grid">
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.gols}</div><div class="stat-lbl" style="color:#BFD1C2;">GOLS NA CARREIRA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.assistencias}</div><div class="stat-lbl" style="color:#BFD1C2;">ASSISTÊNCIAS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${media}</div><div class="stat-lbl" style="color:#BFD1C2;">NOTA MÉDIA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.premios.length}</div><div class="stat-lbl" style="color:#BFD1C2;">PRÊMIOS</div></div>
            </div>
            <div class="spacer"></div>
            <button class="btn" onclick="apagarSaveEIniciar()">🚀 Começar nova carreira</button>
        </div></div>
    `;
}
function apagarSaveEIniciar(){
    localStorage.removeItem(CONFIG.chaveSave);
    jogador=null; mostrarInicio();
}

/* =========================================================
   13) SALVAR / CARREGAR
========================================================= */

function salvarAutomaticamente(){
    try{
        localStorage.setItem(CONFIG.chaveSave, JSON.stringify({
            jogador, clubes, calendario, tabela, abaHub
        }));
    }catch(e){ console.error("Erro ao salvar:",e); }
}
function salvarEConfirmar(){ salvarAutomaticamente(); toast("💾 Carreira salva."); }

function carregarJogo(){
    try{
        const bruto = localStorage.getItem(CONFIG.chaveSave);
        if(!bruto){ alert("Nenhum save encontrado."); return; }
        const dados = JSON.parse(bruto);
        jogador = dados.jogador;
        clubes = dados.clubes || [];
        calendario = dados.calendario || [];
        tabela = dados.tabela || [];
        abaHub = dados.abaHub || "visao";
        if(!Array.isArray(jogador.eventos)) jogador.eventos=[];
        if(!Array.isArray(jogador.premios)) jogador.premios=[];
        if(!Array.isArray(jogador.transferencias)) jogador.transferencias=[];
        if(!Array.isArray(jogador.historicoTemporadas)) jogador.historicoTemporadas=[];
        if(jogador.aposentado) return mostrarAposentadoria();
        mostrarHub();
    }catch(e){
        console.error(e);
        alert("O save está corrompido ou incompatível.");
    }
}

/* =========================================================
   14) INICIALIZAÇÃO
========================================================= */

mostrarInicio();

</script>
