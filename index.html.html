<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAREER MODE — Programa Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* =========================================================
   TOKENS
========================================================= */
:root{
    --paper:#F1E7D3;
    --paper2:#E7DAC0;
    --paper3:#DFCFAE;
    --ink:#16241B;
    --ink-soft:#3C4A3F;
    --pitch:#193C28;
    --pitch2:#123020;
    --pitch3:#0D2419;
    --gold:#C79A2E;
    --gold-light:#E4C465;
    --teal:#2C6E68;
    --teal-light:#5FA79E;
    --brick:#A63D3D;
    --brick-light:#C96A6A;
    --line:#C9B693;
    --white:#FBF6EA;
    --shadow:0 18px 50px rgba(13,20,15,.28);
    --radius:14px;
}

*{box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
    margin:0;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
        radial-gradient(circle at 1px 1px, rgba(22,36,27,.08) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Work Sans',Arial,sans-serif;
}

h1,h2,h3,.display{
    font-family:'Fraunces',Georgia,serif;
    margin:0;
}

button,input,select{font:inherit;}

button{
    border:0;
    cursor:pointer;
    background:none;
    color:inherit;
}

button:disabled{opacity:.4;cursor:not-allowed;}

.app{
    width:min(1180px,100%);
    margin:0 auto;
    padding:22px;
}

/* =========================================================
   PRIMITIVOS
========================================================= */

.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.row.between{justify-content:space-between;}
.center{text-align:center;}
.muted{color:var(--ink-soft);}
.small{font-size:12.5px;}
.spacer{height:16px;}
.grow{flex:1;}

.eyebrow{
    font-size:11.5px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.4px;
}

.card{
    background:var(--white);
    border:1px solid var(--line);
    border-top:4px solid var(--pitch);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    position:relative;
}

.card-dark{
    background:linear-gradient(175deg,var(--pitch) 0%,var(--pitch3) 100%);
    color:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06);
    border-top:4px solid var(--gold);
    position:relative;
    overflow:hidden;
}
.card-dark::before{
    content:"";
    position:absolute;inset:0;
    background:
        radial-gradient(circle at 85% 8%,rgba(228,196,101,.10),transparent 45%),
        repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 34px);
    pointer-events:none;
}
.card-dark > *{position:relative;z-index:1;}

.card-body{padding:22px;}
.card-body.tight{padding:16px;}

.hairline{
    border:0;
    border-top:1px dashed var(--line);
    margin:16px 0;
}

.hairline.on-dark{border-top:1px dashed rgba(255,255,255,.18);}

/* =========================================================
   BOTÕES — estilo "canhoto de ingresso"
========================================================= */

.btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 22px;
    border-radius:11px;
    background:var(--gold);
    color:var(--pitch3);
    font-weight:700;
    letter-spacing:.2px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 0 #8f7220;
}

.btn:hover:not(:disabled){transform:translateY(-2px);}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 3px 0 #8f7220;}

.btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    box-shadow:none;
}

.btn.ghost.on-dark{color:var(--paper);border-color:rgba(255,255,255,.5);}

.btn.brick{background:var(--brick);color:var(--white);box-shadow:0 6px 0 #6f2626;}
.btn.brick:active:not(:disabled){box-shadow:0 3px 0 #6f2626;}

.btn.small{padding:10px 16px;font-size:13px;box-shadow:0 4px 0 #8f7220;}

.btn-stub::after{
    content:"";
    width:1px;
    align-self:stretch;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.35) 0 4px,transparent 4px 9px);
    margin-left:2px;
}

/* =========================================================
   HOME
========================================================= */

.hero{
    min-height:88vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 0;
}

.hero-inner{
    width:min(760px,100%);
    text-align:center;
    color:var(--paper);
    position:relative;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% -10%,rgba(199,154,46,.22),transparent 60%),
               linear-gradient(180deg,var(--pitch) 0%,var(--pitch3) 100%);
    border-radius:20px;
    padding:56px 32px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.06);
    border-top:5px solid var(--gold);
}
.hero-inner::before{
    content:"";
    position:absolute; left:50%; top:-90px;
    width:340px;height:340px;
    border:2px solid rgba(228,196,101,.16);
    border-radius:50%;
    transform:translateX(-50%);
    pointer-events:none;
}
.hero-inner::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; top:60%;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px);
    pointer-events:none;
}
.hero-inner > *{position:relative;z-index:1;}

.hero .kicker{
    display:inline-block;
    padding:6px 14px;
    border:1px solid rgba(228,196,101,.5);
    border-radius:999px;
    color:var(--gold-light);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.5px;
}

.hero h1{
    font-size:clamp(42px,8vw,74px);
    line-height:.98;
    margin:22px 0 0;
    letter-spacing:-1.5px;
}

.hero h1 em{
    font-style:normal;
    color:var(--gold-light);
}

.hero p{
    max-width:520px;
    margin:20px auto 30px;
    color:#CFE0D2;
    line-height:1.6;
    font-size:16.5px;
}

/* =========================================================
   FORMULÁRIO DE CRIAÇÃO
========================================================= */

.form-box{width:min(640px,100%);margin:30px auto;}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}

.field label{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.4px;
    color:var(--ink-soft);
}

.input,.select{
    width:100%;
    padding:14px 15px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
}

.input:focus,.select:focus{border-color:var(--gold);}

.pos-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.pos{
    padding:16px 8px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    text-align:center;
    transition:.15s;
}

.pos:hover,.pos.on{
    border-color:var(--gold);
    background:var(--paper2);
    transform:translateY(-2px);
}

.pos .sig{font-family:'Fraunces',serif;font-size:22px;font-weight:900;}
.pos .nm{margin-top:4px;font-size:10.5px;color:var(--ink-soft);}

/* =========================================================
   FICHA DO JOGADOR
========================================================= */

.attrs-layout{
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:16px;
    align-items:start;
}

.player-sheet{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    position:relative;
    overflow:hidden;
}

.player-sheet::before{
    content:"FICHA DE ATLETA";
    position:absolute;
    top:14px;right:-38px;
    background:var(--gold);
    color:var(--pitch3);
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    padding:4px 42px;
    transform:rotate(35deg);
}

.p-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;}
.p-name{font-size:28px;font-weight:800;letter-spacing:-.5px;}

.p-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.pill{
    padding:6px 11px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
}

.pill.gold{background:var(--gold);border-color:var(--gold);color:var(--pitch3);}

.ovr-box{
    min-width:94px;
    padding:10px 14px;
    border-radius:14px;
    background:var(--pitch);
    color:var(--paper);
    text-align:center;
}
.ovr-label{display:block;font-size:10px;letter-spacing:1px;color:var(--gold-light);font-weight:700;}
.ovr-num{display:block;font-family:'Fraunces',serif;font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;}

.attr-list{display:grid;gap:9px;margin-top:18px;}

.attr{
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
}

.attr-top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13.5px;}
.attr-top b{font-weight:700;}
.attr-top span{font-weight:800;color:var(--pitch);font-variant-numeric:tabular-nums;}

.bar{width:100%;height:7px;border-radius:999px;background:var(--paper3);overflow:hidden;}
.bar > div{height:100%;background:linear-gradient(90deg,var(--pitch),var(--gold));border-radius:inherit;}

/* =========================================================
   ROLETA
========================================================= */

.roulette-wrap{
    max-width:560px;
    margin:0 auto;
    text-align:center;
    color:var(--paper);
}

.roulette-ring{
    width:200px;height:200px;
    margin:22px auto;
    border-radius:50%;
    background:conic-gradient(var(--gold),var(--pitch2),var(--gold-light),var(--pitch2),var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 10px rgba(228,196,101,.08), 0 25px 60px rgba(0,0,0,.4);
}

.roulette-core{
    width:158px;height:158px;
    border-radius:50%;
    background:var(--pitch3);
    border:1px solid rgba(255,255,255,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px;
    text-align:center;
}

.roulette-icon{font-size:30px;}

.roulette-name{
    margin-top:8px;
    max-width:135px;
    font-size:20px;
    font-weight:800;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.spinning{animation:pulse .3s infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.045);}}

.tag-rarity{
    display:inline-block;
    margin-top:14px;
    padding:5px 13px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
}
.tag-comum{background:#3E5347;color:#DCE9DF;}
.tag-raro{background:var(--gold);color:var(--pitch3);}
.tag-lendario{background:linear-gradient(90deg,#E4C465,#C79A2E);color:#2A1F04;box-shadow:0 0 14px rgba(228,196,101,.5);}

.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;}

.choice{
    padding:16px 8px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:var(--paper);
    transition:.15s;
}
.choice:hover{background:rgba(228,196,101,.14);border-color:var(--gold-light);transform:translateY(-2px);}
.choice span{display:block;font-size:11.5px;color:#BFD1C2;margin-bottom:5px;}
.choice strong{font-size:22px;color:var(--gold-light);}

/* =========================================================
   HUB / DASHBOARD
========================================================= */

.hub-head{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
}

.club-strip{
    display:flex;align-items:center;gap:12px;
}

.badge-club{
    width:46px;height:46px;border-radius:10px;
    background:var(--gold);color:var(--pitch3);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:900;font-size:17px;
    box-shadow:0 4px 0 rgba(0,0,0,.18);
}

.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin:18px 0 4px;
}
.tab{
    padding:10px 15px;
    border-radius:999px;
    background:var(--paper2);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    flex:none;
    border:1px solid transparent;
}
.tab.on{background:var(--pitch);color:var(--paper);box-shadow:0 3px 10px rgba(25,60,40,.35);}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}
.stat-box{
    padding:16px;
    border-radius:12px;
    background:var(--paper2);
    border:1px solid var(--line);
    border-bottom:3px solid var(--pitch);
    text-align:center;
}
.stat-box.acc-gold{border-bottom-color:var(--gold);}
.stat-box.acc-teal{border-bottom-color:var(--teal);}
.stat-box.acc-brick{border-bottom-color:var(--brick);}
.stat-num{font-family:'Fraunces',serif;font-size:26px;font-weight:800;color:var(--pitch);}
.stat-box.acc-gold .stat-num{color:#8f7220;}
.stat-box.acc-teal .stat-num{color:var(--teal);}
.stat-box.acc-brick .stat-num{color:var(--brick);}
.stat-lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;margin-top:3px;}

.table-wrap{overflow-x:auto;}
table.league{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
table.league th{
    text-align:left;padding:9px 8px;color:var(--ink-soft);font-size:10.5px;
    letter-spacing:.4px;border-bottom:1.5px solid var(--ink);
}
table.league td{padding:9px 8px;border-bottom:1px solid var(--line);}
table.league tr.me{background:rgba(199,154,46,.14);font-weight:700;}
table.league td.center,table.league th.center{text-align:center;}

.notice{
    padding:14px;border-radius:10px;
    background:var(--paper2);border:1px dashed var(--line);
    font-size:13.5px;
}
.notice.gold{background:rgba(199,154,46,.15);border-color:var(--gold);}
.notice.brick{background:rgba(166,61,61,.12);border-color:var(--brick);}

.timeline{display:flex;flex-direction:column;gap:10px;}
.tl-item{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);
}
.tl-icon{font-size:18px;}
.tl-title{font-weight:700;font-size:13.5px;}
.tl-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

.offer-card{
    padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
}

.train-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);
}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{
    width:30px;height:30px;border-radius:8px;background:var(--pitch);color:var(--paper);font-weight:800;
}
.stepper span{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;}

.chart-wrap{width:100%;overflow-x:auto;}

/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width:1000px){
    .app{padding:16px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:680px){
    body{overflow-x:hidden;}
    .app{padding:12px;}
    .hero-inner{padding:38px 18px;}
    .attrs-layout{grid-template-columns:1fr;}
    .pos-grid{grid-template-columns:repeat(3,1fr);}
    .choice-grid{grid-template-columns:repeat(2,1fr);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .p-name{font-size:22px;}
    .ovr-num{font-size:30px;}
    .card-body{padding:16px;}
    .btn{width:100%;justify-content:center;}
    .offer-card{flex-direction:column;align-items:stretch;text-align:center;}
    .podium{grid-template-columns:1fr;}
}

/* =========================================================
   MORAL / TITULARIDADE / STATUS
========================================================= */

.status-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;
}
.status-titular{background:#2E6B44;color:#E8F5E9;}
.status-rotacao{background:var(--gold);color:var(--pitch3);}
.status-reserva{background:var(--paper3);color:var(--ink-soft);}
.status-fora{background:var(--brick);color:var(--white);}

.moral-bar{width:100%;height:10px;border-radius:999px;background:var(--paper3);overflow:hidden;}
.moral-bar>div{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brick),var(--gold),#2E6B44);}

.attr-pot{font-size:10.5px;color:var(--ink-soft);font-weight:600;}

/* =========================================================
   PÓDIO / PRÊMIOS
========================================================= */

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.podium-slot{
    padding:14px 10px;border-radius:12px;text-align:center;
    background:var(--paper2);border:1px solid var(--line);
}
.podium-slot.first{background:linear-gradient(180deg,var(--gold-light),var(--gold));border-color:var(--gold);}
.podium-slot .pos-num{font-family:'Fraunces',serif;font-size:24px;font-weight:900;}

/* =========================================================
   DIVISÕES
========================================================= */

.div-tabs{display:flex;gap:8px;margin-bottom:12px;}
.div-tab{padding:8px 14px;border-radius:999px;background:var(--paper2);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.div-tab.on{background:var(--pitch);color:var(--paper);}

.rel-up{color:#2E6B44;font-weight:800;}
.rel-down{color:var(--brick);font-weight:800;}

</style>
</head>
<body>

<div class="app"><div id="app"></div></div>

<script src="dados_clubes.js"></script>
<script src="dados_jogadores.js"></script>
<script>
"use strict";

/* =========================================================
   1) DADOS EDITÁVEIS
========================================================= */

// Divisão A (elite) e Divisão B (acesso) — 20 clubes cada, nomes placeholder.
// Troque os nomes à vontade — o resto do código só depende da quantidade (20+20).

function nomePosicaoBanco(pos){
    const p=String(pos||"").toUpperCase();
    if(p.includes("GK")) return "Goleiro";
    if(p.includes("CB")) return "Zagueiro";
    if(p.includes("LB")||p.includes("RB")||p.includes("WB")) return "Lateral";
    if(p.includes("CDM")) return "Volante";
    if(p.includes("CM")||p.includes("CAM")) return "Meia";
    if(p.includes("LW")||p.includes("RW")||p.includes("LM")||p.includes("RM")) return "Ponta";
    if(p.includes("ST")||p.includes("CF")) return "Atacante";
    return pos||"Jogador";
}

function posicoesCompativeis(sigla){
    return {
        GOL:["GK"], ZAG:["CB"], LAT:["LB","RB","LWB","RWB"], VOL:["CDM"],
        MEI:["CM","CAM"], PON:["LW","RW","LM","RM"], ATA:["ST","CF"]
    }[sigla] || [];
}

const PAISES = ["Brasil","Inglaterra","Espanha","Itália","Alemanha","França","Portugal"];


// pesos: usados pra calcular o "poder" do jogador em campo, por estilo de posição.
const POSICOES = [
    { sigla:"GOL", nome:"Goleiro",  atributoChave:"reflexos",   fatorGol:0.005, fatorAss:0.01, fatorDefesa:0.90, pesos:{reflexos:.50,defesa:.25,forca:.15,overall:.10} },
    { sigla:"ZAG", nome:"Zagueiro", atributoChave:"defesa",     fatorGol:0.05,  fatorAss:0.05, fatorDefesa:0.65, pesos:{defesa:.40,forca:.25,cabeceio:.20,overall:.15} },
    { sigla:"LAT", nome:"Lateral",  atributoChave:"velocidade", fatorGol:0.09,  fatorAss:0.18, fatorDefesa:0.40, pesos:{velocidade:.30,defesa:.25,passe:.20,overall:.25} },
    { sigla:"VOL", nome:"Volante",  atributoChave:"defesa",     fatorGol:0.10,  fatorAss:0.20, fatorDefesa:0.35, pesos:{defesa:.30,passe:.25,visao:.20,overall:.25} },
    { sigla:"MEI", nome:"Meia",     atributoChave:"visao",      fatorGol:0.20,  fatorAss:0.34, fatorDefesa:0.15, pesos:{passe:.30,visao:.30,drible:.20,overall:.20} },
    { sigla:"PON", nome:"Ponta",    atributoChave:"drible",     fatorGol:0.34,  fatorAss:0.26, fatorDefesa:0.05, pesos:{drible:.35,velocidade:.25,finalizacao:.25,visao:.15} },

function rndInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function rnd(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function escapeHTML(s){
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
}
function embaralhar(arr){
    const c = arr.slice();
    for(let i=c.length-1;i>0;i--){
        const j = rndInt(0,i);
        [c[i],c[j]] = [c[j],c[i]];
    }
    return c;
}
function moeda(v){ return "R$ " + Math.round(v).toLocaleString("pt-BR"); }
function poisson(lambda){
    lambda = Math.max(0.05,lambda);
    const L = Math.exp(-lambda);
    let k=0, p=1;
    do{ k++; p*=Math.random(); }while(p>L);
    return k-1;
}
function posicaoInfo(sigla){ return POSICOES.find(p=>p.sigla===sigla) || POSICOES[4]; }

function faixaEtaria(idade){
    if(idade<=19) return "desenvolvimento";

    if(idade<=27) return "evolucaoForte";
    if(idade<=30) return "auge";

    return "veterano";
}

        veterano:"Veterano"
    }[faixaEtaria(idade)];
}
function multiplicadorIdade(idade){
    return {
        desenvolvimento:0.93, crescimento:0.97, evolucaoForte:1.0, auge:1.06,
        declinioInicial:0.96, declinioMaior:0.90, veterano:0.82
    }[faixaEtaria(idade)];
}
function aplicarDeclinioIdade(){
    const faixa = faixaEtaria(jogador.idade);
    let fisico=[0,0], tecnico=[0,0];
    if(faixa==="declinioInicial"){ fisico=[1,3]; tecnico=[0,1]; }
    else if(faixa==="declinioMaior"){ fisico=[3,6]; tecnico=[1,2]; }
    else if(faixa==="veterano"){ fisico=[4,8]; tecnico=[2,3]; }
    else return false;

    ATRIBUTOS_FISICOS.forEach(k=>{
        const a = jogador.atributos[k]; if(!a) return;
        a.atual = clamp(a.atual - rndInt(fisico[0],fisico[1]), 20, a.potencial);
    });
    ATRIBUTOS_TECNICOS.forEach(k=>{
        const a = jogador.atributos[k]; if(!a) return;
        a.atual = clamp(a.atual - rndInt(tecnico[0],tecnico[1]), 25, a.potencial);
    });
    jogador.overall = calcularOverall(jogador);
    return true;
}

// Método do círculo pra turno e returno com N times (N par).
function gerarCalendario(nomes){
    const lista = nomes.slice();
    if(lista.length % 2 !== 0) lista.push("BYE");
    const n = lista.length;
    const rodadasTurno = [];
    let rot = lista.slice(1);
    for(let r=0;r<n-1;r++){
        const mesa = [lista[0], ...rot];
        const jogos = [];
        for(let i=0;i<n/2;i++){
            const a = mesa[i], b = mesa[n-1-i];
            if(a!=="BYE" && b!=="BYE") jogos.push(r%2===0?[a,b]:[b,a]);
        }
        rodadasTurno.push(jogos);
        rot.unshift(rot.pop());
    }
    const returno = rodadasTurno.map(r=>r.map(([a,b])=>[b,a]));
    return [...rodadasTurno, ...returno];
}
function tabelaVazia(nomes){
    return nomes.map(nome=>({ clube:nome, pontos:0, jogos:0, vitorias:0, empates:0, derrotas:0, golsPro:0, golsContra:0 }));
}
function forcaClube(nome){
    const c = clubes.find(c=>c.nome===nome);
    if(c) return c.forca;
    const mundo = infoClubeMundo(nome);
    return mundo ? mundo.forca : 65;
}
function atualizarTabela(nomeA,nomeB,golsA,golsB){
    const ta = tabela.find(t=>t.clube===nomeA);
    const tb = tabela.find(t=>t.clube===nomeB);
    if(!ta || !tb) return;
    [[ta,golsA,golsB],[tb,golsB,golsA]].forEach(([t,gf,gc])=>{
        t.jogos++; t.golsPro+=gf; t.golsContra+=gc;
        if(gf>gc){ t.vitorias++; t.pontos+=3; }
        else if(gf===gc){ t.empates++; t.pontos+=1; }
        else{ t.derrotas++; }
    });
}
function tabelaOrdenada(){
    return tabela.slice().sort((a,b)=>{
        if(b.pontos!==a.pontos) return b.pontos-a.pontos;
        const sa=a.golsPro-a.golsContra, sb=b.golsPro-b.golsContra;
        if(sb!==sa) return sb-sa;
        return b.golsPro-a.golsPro;
    });
}
function tabelaSimuladaDivisao(divisao){
    if(divisao===jogador.divisao) return tabelaOrdenada();
    const nomes = (divisoes[divisao]||[]).map(c=>c.nome);
    const agenda = gerarCalendario(nomes);
    const t = tabelaVazia(nomes);
    agenda.forEach(rod=>{
        rod.forEach(([a,b])=>{
            const ga = poisson(Math.max(0.35,0.72+(forcaClube(a)-65)/34));
            const gb = poisson(Math.max(0.35,0.72+(forcaClube(b)-65)/34));
            const ta=t.find(x=>x.clube===a), tb=t.find(x=>x.clube===b);
            if(!ta||!tb) return;
            ta.jogos++; tb.jogos++; ta.golsPro+=ga; ta.golsContra+=gb; tb.golsPro+=gb; tb.golsContra+=ga;
            if(ga>gb){ta.vitorias++; ta.pontos+=3; tb.derrotas++;}
            else if(ga<gb){tb.vitorias++; tb.pontos+=3; ta.derrotas++;}
            else{ta.empates++; tb.empates++; ta.pontos++; tb.pontos++;}
        });
    });
    return t.sort((a,b)=>{
        if(b.pontos!==a.pontos) return b.pontos-a.pontos;
        const sa=a.golsPro-a.golsContra, sb=b.golsPro-b.golsContra;
        if(sb!==sa) return sb-sa;
        return b.golsPro-a.golsPro;
    });
}

function pesoJogador(p){
    const overall = p.overall;
    let peso = overall>=90 ? 0.7 : overall>=75 ? 3 : 8;
    const chave = posicaoInfo(jogador.posicao).atributoChave;
    peso *= 1 + Math.max(0,(p[chave]-55))/45;
    return peso;
}
function sortearPonderado(lista){
    const pesos = lista.map(pesoJogador);
    const total = pesos.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<lista.length;i++){ r-=pesos[i]; if(r<=0) return lista[i]; }
    return lista[lista.length-1];
}

function sortearJogador(){
    if(contarAtributos()>=CONFIG.atributosChave.length) return;
    if(!jogadoresDisponiveis.length){ alert("Acabaram os jogadores disponíveis."); return; }

    const vencedor = sortearPonderado(jogadoresDisponiveis);
    const nomes = jogadoresDisponiveis.map(p=>p.nome);

    app().innerHTML = `

    `;

        el.textContent = nomes[i % nomes.length];
        i++; passos++;
        if(passos<limite){ intervalo+=3; setTimeout(girar,intervalo); return; }
        el.textContent = vencedor.nome;

        jogadoresDisponiveis = jogadoresDisponiveis.filter(j=>j!==vencedor);

    girar();
}

function mostrarJogadorSorteado(sorteado){
    const rarity = rarityDe(sorteado.overall);
    const botoes = CONFIG.atributosChave
        .filter(chave=>!jogador.atributos[chave])
        .map(chave=>`
            <button class="choice" onclick="pegarAtributo('${chave}',${sorteado[chave]})">
                <span>${NOMES_ATRIBUTOS[chave]}</span>
                <strong>${sorteado[chave]}</strong>
            </button>
        `).join("");

    app().innerHTML = `
        <div class="card-dark"><div class="card-body roulette-wrap">
            <span class="eyebrow" style="color:var(--gold-light)">✅ JOGADOR SORTEADO</span>
            <div class="roulette-ring"><div class="roulette-core">
                <div class="roulette-icon">👤</div>
                <div class="roulette-name">${escapeHTML(sorteado.nome)}</div>
            </div></div>
            <span class="tag-rarity tag-${rarity.tag}">${rarity.label} · OVR ${sorteado.overall}</span>
            <h2 style="font-size:24px;margin-top:14px;">Escolha um atributo (potencial)</h2>
            <p class="muted" style="color:#BFD1C2;">Pegue somente UMA característica desse jogador.</p>
            <div class="choice-grid">${botoes}</div>
            <div class="spacer"></div>
            <div class="row" style="justify-content:center;">
                ${jogador.rerollDisponivel ? `<button class="btn ghost on-dark" onclick="usarReroll()">🔄 Re-sortear (1x)</button>` : ""}
                <button class="btn ghost on-dark" onclick="mostrarAtributos()">← Voltar</button>
            </div>
        </div></div>
    `;
}
function usarReroll(){
    if(!jogador.rerollDisponivel) return;
    jogador.rerollDisponivel = false;
    toast("🔄 Re-sorteio usado!");
    sortearJogador();
}
function pegarAtributo(chave,potencial){
    if(jogador.atributos[chave]){ alert("Esse atributo já foi escolhido."); return; }
    const atualInicial = clamp(potencial - rndInt(15,30), 25, potencial);
    jogador.atributos[chave] = { atual: atualInicial, potencial };
    jogador.overall = calcularOverall(jogador);
    mostrarAtributos();
}

========================================================= */

function sortearClube(){
    iniciarDivisoes(jogador.pais);
    jogador.ligaKey = jogador.pais;
    jogador.divisao = "B"; // toda carreira começa na divisão de acesso
    clubes = divisoes.B;
    const nomes = clubes.map(c=>c.nome);
    const vencedor = nomes[rndInt(0,nomes.length-1)];

    app().innerHTML = `
        <div class="card-dark"><div class="card-body roulette-wrap">
            <span class="eyebrow" style="color:var(--gold-light)">🏟️ SORTEANDO CLUBE (DIVISÃO B)</span>
            <div class="roulette-ring"><div class="roulette-core">
                <div class="roulette-icon">🏟️</div>
                <div id="roletaClube" class="roulette-name spinning">🎰</div>
            </div></div>
            <h2 style="font-size:24px;">Girando...</h2>
        </div></div>
    `;
    const el = document.getElementById("roletaClube");
    let i=0, passos=0, intervalo=28; const limite=18;
    function girar(){
        el.textContent = nomes[i % nomes.length];
        i++; passos++;
        if(passos<limite){ intervalo+=3; setTimeout(girar,intervalo); return; }
        el.textContent = vencedor;
        el.classList.remove("spinning");
        setTimeout(()=>iniciarTemporada(vencedor),700);
    }
    girar();
}

function iniciarTemporada(clube){
    jogador.clube = clube;
    jogador.maiorOverall = jogador.overall;
    jogador.rodada = 0;
    novaTemporadaDivisao();
    salvarAutomaticamente();
    mostrarHub();
}

function viewHistorico(){
    if(!jogador.historicoTemporadas.length) return `<div class="notice">Nenhuma temporada concluída ainda.</div>`;
    const w=560, h=160, pad=24;
    const overalls = jogador.historicoTemporadas.map(t=>t.overallFinal);
    const min = Math.min(...overalls,jogador.overall)-3, max = Math.max(...overalls,jogador.overall)+3;
    const pts = overalls.map((v,i)=>{
        const x = pad + i*((w-pad*2)/Math.max(1,overalls.length-1));
        const y = h-pad - ((v-min)/(max-min||1))*(h-pad*2);
        return `${x},${y}`;
    }).join(" ");
    const eventos = jogador.eventos.slice(-10).reverse().map(e=>`
        <div class="tl-item"><div class="tl-icon">${e.icone}</div><div><div class="tl-title">${escapeHTML(e.titulo)}</div><div class="tl-sub">${escapeHTML(e.sub)}</div></div></div>
    `).join("");
    return `
        <div class="card"><div class="card-body">
            <h3 style="font-size:17px;">Evolução do overall</h3>
            <div class="chart-wrap">
                <svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;">
                    <polyline points="${pts}" fill="none" stroke="#C79A2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div></div>
        <div class="spacer"></div>
        <div class="card"><div class="card-body">
            <h3 style="font-size:17px;">Linha do tempo</h3>

        </div></div>
    `;
}

    const mapa=Object.create(null);
    todosClubesMundo().forEach(c=>{

    });
    return mapa;
}

function prepararMundoTemporada(){
    if(!bancoJogadores.length) return;
    mundoStats = Object.create(null);
    const mapa=obterClubesMonitorados();
    const porClube=Object.create(null);
    bancoJogadores.forEach(p=>{
        const clube=mapa[p.clubeKey];
        if(!clube) return;
        if(!porClube[clube.id]) porClube[clube.id]=[];
        porClube[clube.id].push(p);
    });
    Object.values(porClube).forEach(lista=>{
        lista.sort((a,b)=>b.overall-a.overall);
        lista.slice(0,25).forEach(p=>{
            mundoStats[p.id]={
                id:p.id, nome:p.nome, clube:mapa[p.clubeKey].nome, ligaKey:mapa[p.clubeKey].ligaKey,
                divisao:mapa[p.clubeKey].divisao, forcaClube:mapa[p.clubeKey].forca, overall:p.overall,
                posicao:p.posicao, posicaoNome:nomePosicaoBanco(p.posicao), gols:0, assistencias:0, jogos:0,
                minutos:0, somaNotas:0, media:6.5, cleanSheets:0,
                pontuacaoBola:0, valor:p.valor||0
            };
        });
    });
    jogador.mundoStats=[];
}

function pesoPosicaoMundo(pos){
    const s=nomePosicaoBanco(pos);
    if(s==='Atacante') return {gol:.030,ass:.012};
    if(s==='Ponta') return {gol:.022,ass:.020};
    if(s==='Meia') return {gol:.014,ass:.028};
    if(s==='Lateral') return {gol:.008,ass:.016};
    if(s==='Volante') return {gol:.006,ass:.018};
    if(s==='Zagueiro') return {gol:.004,ass:.005};
    return {gol:0,ass:.001};
}

function simularMundoRodada(){
    if(!Object.keys(mundoStats).length || !bancoJogadores.length) return;
    Object.values(mundoStats).forEach(p=>{
        const chanceEntrar=clamp(0.48 + (p.overall-p.forcaClube)/45,0.18,0.95);
        if(Math.random()>chanceEntrar) return;
        const titular=clamp(0.48 + (p.overall-p.forcaClube)/35,0.18,0.92);
        const minutos=titular ? rndInt(58,90) : rndInt(12,42);
        const mult=minutos/90;
        const pos=pesoPosicaoMundo(p.posicao);
        const qualidade=clamp(0.62+(p.overall-70)/115,0.35,1.25);
        const forca=clamp(0.78+(p.forcaClube-60)/85,0.55,1.38);
        const gols=poisson(Math.max(0.03,pos.gol*qualidade*forca*mult));
        const ass=poisson(Math.max(0.03,pos.ass*qualidade*forca*mult));
        const nota=clamp(6.35 + (p.overall-70)/50 + gols*0.55 + ass*0.35 + rnd(-0.45,0.45),5.3,9.7);
        p.gols+=gols; p.assistencias+=ass; p.jogos++; p.minutos+=minutos; p.somaNotas+=nota; p.media=p.somaNotas/p.jogos;
        if(nomePosicaoBanco(p.posicao)==='Goleiro' && Math.random()<clamp(0.32+(p.forcaClube-60)/120,0.15,0.68)) p.cleanSheets++;
        const prestigio=(p.forcaClube-55)/2;
        p.pontuacaoBola=p.gols*1.35+p.assistencias*1.05+p.media*8+p.overall*0.34+prestigio;
    });
}

        euMesmo:true

function calcularStatusEMinutos(){
    const pos=posicaoInfo(jogador.posicao);
    const elenco=getElencoClube(jogador.clube);
    const possiveis=posicoesCompativeis(pos.sigla);
    const rivais=elenco.filter(p=>possiveis.some(x=>String(p.posicao).toUpperCase().split(",").map(v=>v.trim()).includes(x))).slice(0,8);
    const melhorRival=rivais.length ? Math.max(...rivais.map(p=>p.overall)) : forcaClube(jogador.clube)+rndInt(-5,8);
    const moralBonus=(jogador.moral-50)/5;
    const poucaConcorrencia=rivais.length<=2 ? 4 : rivais.length<=4 ? 2 : 0;
    const diff=jogador.overall-melhorRival+moralBonus+poucaConcorrencia;
    let status,min,max;
    if(diff>=7){status="Titular";min=72;max=90;}
    else if(diff>=2){status="Titular ocasional";min=55;max=76;}
    else if(diff>=-5){status="Rotação";min=30;max=60;}
    else if(diff>=-12){status="Reserva";min=8;max=30;}
    else {status="Fora dos planos";min=0;max=8;}
    jogador.status=status;
    return min===max ? min : rndInt(min,max);
}
function chanceLesao(){ return clamp(0.05 - atributoAtual("resistencia")/2200, 0.012, 0.07); }

function poderJogador(){
    const pos = posicaoInfo(jogador.posicao);
    let poder = 0;
    for(const k in pos.pesos){
        const v = k==="overall" ? jogador.overall : atributoAtual(k);
        poder += v*pos.pesos[k];
    }
    return poder;
}

function jogarRodada(){
    if(jogador.rodada>=calendario.length) return;

    const jaEstavaLesionado = jogador.lesaoRestante>0;
    const jogos = calendario[jogador.rodada];
    const meuJogo = jogos.find(([a,b])=>a===jogador.clube||b===jogador.clube);

    jogos.forEach(([a,b])=>{
        if(meuJogo && a===meuJogo[0] && b===meuJogo[1]) return;
        const ga = poisson(0.6+(forcaClube(a)-60)/40);
        const gb = poisson(0.6+(forcaClube(b)-60)/40);
        atualizarTabela(a,b,ga,gb);
    });

    // O mundo segue andando: jogadores reais dos elencos também acumulam estatísticas.
    simularMundoRodada();

    let resumoHTML = "";
    let minutos = 0;

    if(!jaEstavaLesionado && meuJogo) minutos = calcularStatusEMinutos();

    if(meuJogo && jaEstavaLesionado){
        const souA = meuJogo[0]===jogador.clube;
        const meuClube = souA?meuJogo[0]:meuJogo[1];
        const adversario = souA?meuJogo[1]:meuJogo[0];
        const ga = poisson(0.6+(forcaClube(meuClube)-68)/40);
        const gb = poisson(0.6+(forcaClube(adversario)-60)/40);
        atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?ga:gb, souA?gb:ga);
        jogador.lesaoRestante--;
        resumoHTML = `
            <h3 style="font-size:17px;">${meuClube} ${souA?ga:gb} x ${souA?gb:ga} ${adversario}</h3>
            <p class="small muted">🩹 Você ficou de fora se recuperando. ${jogador.lesaoRestante>0?`Faltam ${jogador.lesaoRestante} rodada(s).`:"Você está liberado pra próxima rodada!"}</p>
        `;
    } else if(meuJogo && minutos===0){
        const souA = meuJogo[0]===jogador.clube;
        const meuClube = souA?meuJogo[0]:meuJogo[1];
        const adversario = souA?meuJogo[1]:meuJogo[0];
        const ga = poisson(0.6+(forcaClube(meuClube)-65)/40);
        const gb = poisson(0.6+(forcaClube(adversario)-60)/40);
        atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?ga:gb, souA?gb:ga);
        jogador.moral = clamp(jogador.moral-2,0,100);
        jogador.condicionamento = clamp(jogador.condicionamento+rndInt(1,3),0,100);
        resumoHTML = `
            <h3 style="font-size:17px;">${meuClube} ${souA?ga:gb} x ${souA?gb:ga} ${adversario}</h3>
            <p class="small muted">🪑 Status: <b>${jogador.status}</b> — você não entrou nessa rodada.</p>
        `;
    } else if(meuJogo){
        const souA = meuJogo[0]===jogador.clube;
        const meuClube = souA?meuJogo[0]:meuJogo[1];
        const adversario = souA?meuJogo[1]:meuJogo[0];
        const pos = posicaoInfo(jogador.posicao);
        const ageMult = multiplicadorIdade(jogador.idade);
        const formaMult = 1 + (jogador.forma||0)/100;
        const minutosMult = minutos/90;
        const fisicoMult = clamp(0.85 + jogador.condicionamento/400, 0.8, 1.15);

        const chanceLesaoEfetiva = clamp(chanceLesao()*(1.3-jogador.condicionamento/200), 0.008, 0.1);

        if(Math.random() < chanceLesaoEfetiva){
            jogador.lesaoRestante = rndInt(1,3);
            const ga = poisson(0.6+(forcaClube(meuClube)-65)/40);
            const gb = poisson(0.6+(forcaClube(adversario)-60)/40);
            atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?ga:gb, souA?gb:ga);
            jogador.eventos.push({icone:"🩹",titulo:"Lesão",sub:`Fora por ${jogador.lesaoRestante} rodada(s).`});
            resumoHTML = `<div class="notice brick">🩹 Você se lesionou durante a partida e ficará de fora por ${jogador.lesaoRestante} rodada(s).</div>`;
        } else if(pos.sigla==="GOL"){
            // ---- sistema próprio de goleiro ----
            const reflexosAtual = atributoAtual("reflexos");
            const chutesSofridos = poisson(3 + (forcaClube(adversario)-70)/20);
            const taxaDefesa = clamp((0.30 + reflexosAtual/150) * fisicoMult * minutosMult, 0.25, 0.9);
            let golsSofridosPartida = Math.max(0, Math.round(chutesSofridos*(1-taxaDefesa)));
            let penaltiDefendidoPartida = 0;
            if(Math.random()<0.12){
                if(Math.random() < reflexosAtual/160) penaltiDefendidoPartida = 1;
                else golsSofridosPartida++;
            }
            const defesasPartida = Math.max(0, chutesSofridos - golsSofridosPartida);
            const defesasDificeisPartida = poisson(defesasPartida*0.3*(reflexosAtual/99));
            const golsTimeExtra = poisson(0.9+(forcaClube(meuClube)-70)/40);
            const meusGols = golsTimeExtra;

            atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?meusGols:golsSofridosPartida, souA?golsSofridosPartida:meusGols);

            let notaGK = 6.0 + defesasPartida*0.15 + defesasDificeisPartida*0.4 + penaltiDefendidoPartida*1.2 + (golsSofridosPartida===0?0.8:0) - golsSofridosPartida*0.3 + rnd(-0.2,0.2);
            if(meusGols>golsSofridosPartida) notaGK += 0.2; else if(meusGols<golsSofridosPartida) notaGK -= 0.2;
            notaGK = clamp(notaGK,3,10);

            jogador.jogos++; jogador.somaNotas += notaGK;
            jogador.jogosCarreira++; jogador.somaNotasCarreira += notaGK;
            jogador.defesas += defesasPartida; jogador.defesasDificeis += defesasDificeisPartida;
            jogador.defesasCarreira += defesasPartida; jogador.defesasDificeisCarreira += defesasDificeisPartida;
            jogador.golsSofridos += golsSofridosPartida; jogador.penaltisDefendidos += penaltiDefendidoPartida;
            jogador.golsSofridosCarreira += golsSofridosPartida; jogador.penaltisDefendidosCarreira += penaltiDefendidoPartida;
            if(golsSofridosPartida===0){ jogador.jogosSemSofrerGol++; jogador.jogosSemSofrerGolCarreira++; }
            jogador.minutosTotais += minutos;
            jogador.minutosCarreira += minutos;
            if(minutos>=60) jogador.titularidades++; else jogador.entradasBanco++;
            if(meusGols>golsSofridosPartida) jogador.vitorias++;
            else if(meusGols===golsSofridosPartida) jogador.empates++;
            else jogador.derrotas++;

            jogador.moral = clamp(jogador.moral + (notaGK-6.5)*4 + defesasDificeisPartida*2 + penaltiDefendidoPartida*6 + (meusGols>golsSofridosPartida?3:meusGols<golsSofridosPartida?-3:0), 0, 100);
            jogador.forma = clamp((jogador.forma||0)*0.7 + (notaGK-6.5)*3, -10, 10);
            jogador.condicionamento = clamp(jogador.condicionamento - rndInt(2,5), 0, 100);

            resumoHTML = `
                <h3 style="font-size:17px;">${meuClube} ${meusGols} x ${golsSofridosPartida} ${adversario}</h3>
                <p class="small muted">Status: <b>${jogador.status}</b> (${minutos} min) · Nota: <b>${notaGK.toFixed(1)}</b> · Defesas: ${defesasPartida} (${defesasDificeisPartida} difíceis)${penaltiDefendidoPartida?" · 🧤 Defendeu um pênalti!":""}</p>
            `;
        } else {
            const poder = poderJogador();
            const golsJogador = poisson(pos.fatorGol * (atributoAtual("finalizacao")/70) * (poder/70) * ageMult * formaMult * minutosMult * fisicoMult);
            const assistJogador = poisson(pos.fatorAss * (atributoAtual("passe")/70) * (poder/70) * ageMult * formaMult * minutosMult * fisicoMult);

            const reducaoDefesa = clamp(pos.fatorDefesa * (atributoAtual("defesa")/99) * ageMult * minutosMult, 0, 0.6);
            const lambdaAdvBase = 0.9+(forcaClube(adversario)-65)/40;
            const golsAdv = poisson(lambdaAdvBase*(1-reducaoDefesa));
            const golsTimeExtra = poisson(0.9+(forcaClube(meuClube)-70)/40);
            const meusGols = golsJogador + golsTimeExtra;

            atualizarTabela(souA?meuClube:adversario, souA?adversario:meuClube, souA?meusGols:golsAdv, souA?golsAdv:meusGols);

            let nota = 6.0 + golsJogador*0.7 + assistJogador*0.5 + (poder*fisicoMult-70)/40 + rnd(-0.3,0.3);
            if(meusGols>golsAdv) nota += 0.2; else if(meusGols<golsAdv) nota -= 0.25;
            nota = clamp(nota,3,10);

            jogador.jogos++; jogador.gols+=golsJogador; jogador.assistencias+=assistJogador; jogador.somaNotas+=nota;
            jogador.jogosCarreira++; jogador.golsCarreira+=golsJogador; jogador.assistenciasCarreira+=assistJogador; jogador.somaNotasCarreira+=nota;
            jogador.minutosTotais += minutos; jogador.minutosCarreira += minutos;
            jogador.minutosCarreira += minutos;
            if(minutos>=60) jogador.titularidades++; else jogador.entradasBanco++;
            if(meusGols>golsAdv) jogador.vitorias++;
            else if(meusGols===golsAdv) jogador.empates++;
            else jogador.derrotas++;

            jogador.moral = clamp(jogador.moral + (nota-6.5)*4 + (golsJogador+assistJogador)*3 + (meusGols>golsAdv?3:meusGols<golsAdv?-3:0), 0, 100);
            jogador.forma = clamp((jogador.forma||0)*0.7 + (nota-6.5)*3, -10, 10);
            jogador.condicionamento = clamp(jogador.condicionamento - rndInt(2,5), 0, 100);

            resumoHTML = `
                <h3 style="font-size:17px;">${meuClube} ${meusGols} x ${golsAdv} ${adversario}</h3>
                <p class="small muted">Status: <b>${jogador.status}</b> (${minutos} min) · Nota: <b>${nota.toFixed(1)}</b> · Gols: ${golsJogador} · Assistências: ${assistJogador}</p>
            `;
        }
    } else {
        resumoHTML = `<div class="notice">Você não jogou esta rodada (fora do calendário do seu clube).</div>`;
    }

    jogador.rodada++;
    if(!meuJogo && jogador.lesaoRestante>0) jogador.lesaoRestante--;
    jogador.rodadasSemProposta = (jogador.rodadasSemProposta||0) + 1;
    tentarGerarProposta();

    if(!jogador.selecaoConvocado && jogador.overall>=80 && Math.random()<0.08){
        jogador.selecaoConvocado = true;
        jogador.eventos.push({icone:"🌎",titulo:"Convocado!",sub:`Chamado pela seleção de ${jogador.pais}.`});
        toast("🌎 Você foi convocado pra seleção!");
    } else if(jogador.selecaoConvocado && Math.random()<0.2){
        jogador.selecaoJogos++;
        jogador.selecaoGols += poisson(0.3*(jogador.overall/85));
    }

    jogador.valorMercado = Math.round(jogador.valorMercado*1.01 + jogador.overall*300);
    ultimoResultado = resumoHTML;
    salvarAutomaticamente();
    mostrarHub();
}

function tierClube(overall){
    if(overall>=90) return {min:72,max:99};
    if(overall>=82) return {min:68,max:92};
    if(overall>=75) return {min:62,max:86};
    if(overall>=68) return {min:55,max:80};
    return {min:45,max:72};
}
function todosClubes(){ return todosClubesMundo(); }
function chanceProposta(){
    let base = jogador.divisao==="A" ? 0.075 : 0.06;
    base += Math.max(0,(jogador.forma||0))/180;
    base += Math.max(0,(jogador.moral-60))/900;
    base += (jogador.empresario.nivel-1)*0.012;
    base += Math.min(jogador.rodadasSemProposta||0,12)*0.008;
    if(jogador.empresario.clubeContato && jogador.rodada <= jogador.empresario.contatoAteRodada) base *= 1.8;
    return clamp(base,0.04,0.34);
}
function tierClube(overall){
    if(overall>=90) return {min:75,max:99};
    if(overall>=82) return {min:68,max:96};
    if(overall>=75) return {min:60,max:88};
    if(overall>=68) return {min:52,max:80};
    return {min:45,max:72};
}
function gerarPropostaTransferencia(preferidoNome=null){
    const tier = tierClube(jogador.overall);
    const candidatos = todosClubes().filter(c=>{
        if(c.nome===jogador.clube) return false;
        if(c.forca<tier.min || c.forca>tier.max) return false;
        if(c.nome===preferidoNome) return true;
        return true;
    });
    if(!candidatos.length) return null;
    let alvo = null;
    if(preferidoNome){
        const preferido = candidatos.find(c=>c.nome===preferidoNome);
        if(preferido) alvo = preferido;
    }
    if(!alvo){
        const proximos = candidatos.filter(c=>Math.abs(c.forca-jogador.overall)<=18);
        const pool = proximos.length ? proximos : candidatos;
        alvo = pool[rndInt(0,pool.length-1)];
    }
    const multiplicadorDesempenho = 1 + Math.max(0,(jogador.forma||0))/35 + Math.max(0,(jogador.moral-60))/180;
    const multiplicadorEmpresario = 1 + (jogador.empresario.nivel-1)*0.18;
    const valor = Math.round(jogador.valorMercado * rnd(0.9,1.55) * multiplicadorDesempenho * multiplicadorEmpresario);
    return { clube: alvo.nome, divisao: alvo.divisao, ligaKey: alvo.ligaKey, liga: alvo.liga, valor };
}
function tentarGerarProposta(){
    if(ofertaAtual || jogador.overall<55) return false;
    const contatoAtivo = jogador.empresario.clubeContato && jogador.rodada <= jogador.empresario.contatoAteRodada;
    const forcar = (jogador.rodadasSemProposta||0) >= 12 && jogador.overall>=62;
    if(!contatoAtivo && !forcar && Math.random()>=chanceProposta()) return false;
    ofertaAtual = gerarPropostaTransferencia(contatoAtivo ? jogador.empresario.clubeContato : null);
    if(!ofertaAtual) return false;
    jogador.rodadasSemProposta = 0;
    jogador.eventos.push({icone:"📩",titulo:"Proposta recebida",sub:`${ofertaAtual.clube} quer contratar você.`});
    toast(`📩 ${ofertaAtual.clube} mandou proposta!`);
    return true;
}
function ligarParaClube(){
    if(jogador.empresario.ligacaoUsadaTemporada){ toast("Seu empresário já fez uma ligação nesta temporada."); return; }
    const select = document.getElementById("clubeContatoSelect");
    const nomeClube = select ? select.value : "";
    const clube = todosClubes().find(c=>c.nome===nomeClube);
    if(!clube){ toast("Escolha um clube."); return; }
    if(clube.nome===jogador.clube){ toast("Seu empresário não precisa ligar para o seu próprio clube."); return; }
    const custo = 8000 + jogador.empresario.nivel*7000;
    if(jogador.dinheiro<custo){ toast("Dinheiro insuficiente para essa abordagem."); return; }
    jogador.dinheiro -= custo;
    jogador.empresario.ligacaoUsadaTemporada = true;
    jogador.empresario.clubeContato = clube.nome;
    jogador.empresario.contatoAteRodada = jogador.rodada + 8;
    const compat = jogador.overall - clube.forca;
    const chanceResposta = clamp(0.28 + jogador.empresario.nivel*0.14 + compat*0.012,0.18,0.86);
    jogador.eventos.push({icone:"📞",titulo:"Empresário entrou em contato",sub:`Ligou para ${clube.nome}. A chance de interesse aumentou pelas próximas 8 rodadas.`});
    if(!ofertaAtual && Math.random()<chanceResposta){
        ofertaAtual = gerarPropostaTransferencia(clube.nome);
        if(ofertaAtual){
            jogador.rodadasSemProposta = 0;
            jogador.eventos.push({icone:"🤝",titulo:"Clube demonstrou interesse",sub:`${clube.nome} respondeu ao contato do empresário.`});
            toast(`🤝 ${clube.nome} demonstrou interesse!`);
        }
    } else {
        toast(`📞 ${clube.nome} foi contatado!`);
    }
    salvarAutomaticamente();
    mostrarHub();
}

function evoluirAutomaticamente(){
    const antes = jogador.overall;
    let subiu=0;
    CONFIG.atributosChave.forEach(k=>{
        const a=jogador.atributos[k];
        if(!a) return;
        const novo=clamp(a.atual+5,20,a.potencial);
        if(novo>a.atual) subiu += novo-a.atual;
        a.atual=novo;
    });
    jogador.overall=calcularOverall(jogador);
    return {antes,depois:jogador.overall,total:subiu};
}

function finalizarTemporada(){
    if(jogador.temporadaFinalizada===jogador.temporada) return;
    jogador.temporadaFinalizada=jogador.temporada;
    const media = jogador.jogos ? jogador.somaNotas/jogador.jogos : 0;
    const ordemFinal = tabelaOrdenada();
    const posicaoFinal = ordemFinal.findIndex(t=>t.clube===jogador.clube)+1;

    const patrocinio = Math.round(jogador.overall*8000 + media*4000);
    jogador.dinheiro += patrocinio;

    const evolucao = evoluirAutomaticamente();
    const declinioAplicado = aplicarDeclinioIdade();

    const { candidatosChuteira, candidatosBola } = calcularPremiosTemporada(media, posicaoFinal);
    const premiosTemporada = [];
    if(candidatosChuteira[0].euMesmo){ premiosTemporada.push("Chuteira de Ouro"); jogador.premios.push({temporada:jogador.temporada,titulo:"Chuteira de Ouro"}); }
    if(candidatosBola[0].euMesmo){ premiosTemporada.push("Bola de Ouro"); jogador.premios.push({temporada:jogador.temporada,titulo:"Bola de Ouro"}); }

    // título da liga
    let textoTitulo = "";
    if(posicaoFinal===1){
        jogador.titulosCarreira++;
        jogador.titulosLiga++;
        textoTitulo = `🏆 ${jogador.clube} foi campeão da Divisão ${jogador.divisao}!`;
        jogador.eventos.push({icone:"🏆",titulo:"Título de liga",sub:`${jogador.clube} terminou a temporada em 1º lugar.`});
    }

    // acesso / rebaixamento: os 3 primeiros da B sobem, os 3 últimos da A descem
    let textoAcesso = "";
    const divisaoFinalTemporada = jogador.divisao;
    if(jogador.divisao==="B"){
        const top3 = ordemFinal.slice(0,3).map(t=>t.clube);
        const promovidos = divisoes.B.filter(c=>top3.includes(c.nome));
        const bottom3A = tabelaSimuladaDivisao("A").slice(-3).map(t=>t.clube);
        const rebaixados = divisoes.A.filter(c=>bottom3A.includes(c.nome));
        divisoes.B = divisoes.B.filter(c=>!top3.includes(c.nome));
        divisoes.A = divisoes.A.filter(c=>!bottom3A.includes(c.nome));
        divisoes.A.push(...promovidos);
        divisoes.B.push(...rebaixados);
        if(top3.includes(jogador.clube)){
            jogador.divisao = "A";
            textoAcesso = `🔺 ${jogador.clube} foi promovido pra Divisão A!`;
            jogador.eventos.push({icone:"🔺",titulo:"Acesso!",sub:`${jogador.clube} subiu pra Divisão A.`});
        } else {
            textoAcesso = `${top3.join(", ")} subiram pra Divisão A.`;
        }
    } else {
        const n = ordemFinal.length;
        const bottom3 = ordemFinal.slice(n-3).map(t=>t.clube);
        const rebaixados = divisoes.A.filter(c=>bottom3.includes(c.nome));
        const tabelaB = tabelaSimuladaDivisao("B");
        const promovidos = divisoes.B.filter(c=>tabelaB.slice(0,3).some(t=>t.clube===c.nome));
        divisoes.A = divisoes.A.filter(c=>!bottom3.includes(c.nome));
        divisoes.B = divisoes.B.filter(c=>!promovidos.includes(c));
        divisoes.B.push(...rebaixados);
        divisoes.A.push(...promovidos);
        if(bottom3.includes(jogador.clube)){
            jogador.divisao = "B";
            textoAcesso = `🔻 ${jogador.clube} foi rebaixado pra Divisão B.`;
            jogador.eventos.push({icone:"🔻",titulo:"Rebaixamento",sub:`${jogador.clube} caiu pra Divisão B.`});
        } else {
            textoAcesso = `${bottom3.join(", ")} caíram pra Divisão B.`;
        }
    }

    jogador.historicoTemporadas.push({
        temporada:jogador.temporada, overallFinal:jogador.overall, jogos:jogador.jogos,
        gols:jogador.gols, assistencias:jogador.assistencias, media:Number(media.toFixed(2)),
        premios:premiosTemporada, posicaoFinal, divisao:divisaoFinalTemporada,

    });
    jogador.eventos.push({icone:"📅",titulo:`Fim da temporada ${jogador.temporada}`,sub:`${jogador.gols} gols, nota média ${media.toFixed(2)}`});

    app().innerHTML = `
        <div class="card-dark"><div class="card-body center">
            <span class="eyebrow" style="color:var(--gold-light)">📋 RESUMO DA TEMPORADA ${jogador.temporada}</span>
            <h2 style="font-size:28px;margin-top:10px;">${jogador.clube} terminou em ${posicaoFinal}º lugar</h2>
            <p class="muted" style="color:#CFE0D2;">${textoAcesso}</p>
            ${textoTitulo?`<div class="notice gold">${textoTitulo}</div>`:""}
            <div class="spacer"></div>
            <div class="stat-grid">
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.gols}</div><div class="stat-lbl" style="color:#BFD1C2;">GOLS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.assistencias}</div><div class="stat-lbl" style="color:#BFD1C2;">ASSISTÊNCIAS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${media.toFixed(2)}</div><div class="stat-lbl" style="color:#BFD1C2;">NOTA MÉDIA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${moeda(patrocinio)}</div><div class="stat-lbl" style="color:#BFD1C2;">PATROCÍNIO</div></div>
            </div>
            <div class="spacer"></div>
            <h3 style="font-size:16px;color:var(--gold-light);">👟 Chuteira de Ouro</h3>
            <div class="spacer"></div>
            ${podiumHTML(candidatosChuteira,"gols")}
            <div class="spacer"></div>
            <h3 style="font-size:16px;color:var(--gold-light);">🏆 Bola de Ouro</h3>
            <div class="spacer"></div>
            ${podiumHTML(candidatosBola,"")}
            <div class="spacer"></div>
            ${premiosTemporada.length ? `<div class="notice gold">🎉 Você faturou: ${premiosTemporada.join(" · ")}</div>` : `<div class="notice">Você não venceu nenhum prêmio individual nesta temporada.</div>`}
            ${declinioAplicado ? `<div class="spacer"></div><div class="notice brick">⚠️ A idade começou a cobrar seu preço fisicamente.</div>` : ""}
            <div class="spacer"></div>
            <div class="notice" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);">📈 Evolução automática: <b>+5 em cada atributo</b> (limitado pelo potencial). O overall foi de <b>${evolucao.antes}</b> para <b>${evolucao.depois}</b>.</div>
            <div class="spacer"></div>
            <button class="btn" onclick="proximaTemporada()">Iniciar temporada ${jogador.temporada+1} →</button>

    `;
}

function proximaTemporada(){
    jogador.idade++;
    if(jogador.idade>=40){
        jogador.aposentado = true;
        jogador.eventos.push({icone:"🏁",titulo:"Aposentadoria",sub:"Encerrou a carreira aos 40 anos."});
        salvarAutomaticamente();
        mostrarAposentadoria();
        return;
    }
    jogador.temporada++;
    const mudouLiga = !!jogador.ligaProximaTemporada && jogador.ligaProximaTemporada!==jogador.ligaKey;
    if(jogador.clubeProximaTemporada){
        const antigo = jogador.clube;
        jogador.clube = jogador.clubeProximaTemporada;
        jogador.divisao = jogador.divisaoProximaTemporada || "B";
        jogador.ligaKey = jogador.ligaProximaTemporada || jogador.ligaKey;
        jogador.eventos.push({icone:"✈️",titulo:"Novo clube",sub:`${antigo} → ${jogador.clube}. Você começa a nova temporada no ${LIGAS_BASE[jogador.ligaKey]?.nome||"novo campeonato"}.`});
        jogador.clubeProximaTemporada = null;
        jogador.divisaoProximaTemporada = null;
        jogador.ligaProximaTemporada = null;
    }
    jogador.rodada = 0;
    jogador.jogos=0; jogador.gols=0; jogador.assistencias=0; jogador.somaNotas=0;
    jogador.vitorias=0; jogador.empates=0; jogador.derrotas=0;
    jogador.minutosTotais=0; jogador.titularidades=0; jogador.entradasBanco=0;
    jogador.defesas=0; jogador.defesasDificeis=0; jogador.golsSofridos=0; jogador.jogosSemSofrerGol=0; jogador.penaltisDefendidos=0;
    jogador.rodadasSemProposta = 0;
    jogador.empresario.ligacaoUsadaTemporada = false;
    jogador.empresario.clubeContato = null;
    jogador.empresario.contatoAteRodada = 0;
    jogador.maiorOverall = Math.max(jogador.maiorOverall,jogador.overall);
    if(mudouLiga) iniciarDivisoes(jogador.ligaKey);
    novaTemporadaDivisao();
    ultimoResultado = null;
    salvarAutomaticamente();
    mostrarHub();
}

/* =========================================================
   16) APOSENTADORIA
========================================================= */

function aposentarJogador(){
    if(!confirm("Tem certeza que quer se aposentar? Isso encerra a carreira atual.")) return;
    jogador.aposentado = true;
    salvarAutomaticamente();
    mostrarAposentadoria();
}
function mostrarAposentadoria(){
    const jogos = jogador.jogosCarreira || 0;
    const gols = jogador.golsCarreira || 0;
    const assist = jogador.assistenciasCarreira || 0;
    const media = jogos ? ((jogador.somaNotasCarreira||0)/jogos).toFixed(2) : "—";
    const temporadas = jogador.historicoTemporadas.length;
    return `
        <div class="card-dark"><div class="card-body center">
            <span class="eyebrow" style="color:var(--gold-light)">🏁 CARREIRA ENCERRADA</span>
            <h2 style="font-size:32px;margin-top:10px;">${escapeHTML(jogador.nome)}</h2>
            <p class="muted" style="color:#CFE0D2;">${temporadas} temporada(s) · Maior overall: ${jogador.maiorOverall} · Aposentado aos ${jogador.idade} anos</p>
            <div class="spacer"></div>
            <div class="stat-grid">
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogos}</div><div class="stat-lbl" style="color:#BFD1C2;">JOGOS NA CARREIRA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${gols}</div><div class="stat-lbl" style="color:#BFD1C2;">GOLS NA CARREIRA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${assist}</div><div class="stat-lbl" style="color:#BFD1C2;">ASSISTÊNCIAS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${media}</div><div class="stat-lbl" style="color:#BFD1C2;">NOTA MÉDIA</div></div>
            </div>
            <div class="spacer"></div>
            <div class="stat-grid">
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.titulosCarreira||0}</div><div class="stat-lbl" style="color:#BFD1C2;">TÍTULOS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.titulosLiga||0}</div><div class="stat-lbl" style="color:#BFD1C2;">TÍTULOS DE LIGA</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.premios.length}</div><div class="stat-lbl" style="color:#BFD1C2;">PRÊMIOS INDIVIDUAIS</div></div>
                <div class="stat-box" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);"><div class="stat-num" style="color:var(--gold-light)">${jogador.minutosCarreira||0}</div><div class="stat-lbl" style="color:#BFD1C2;">MINUTOS</div></div>
            </div>
            <div class="spacer"></div>
            <div class="notice gold"><b>🏆 Títulos:</b> ${jogador.titulosCarreira||0} · <b>🥇 Liga:</b> ${jogador.titulosLiga||0} · <b>🏅 Prêmios:</b> ${jogador.premios.length}</div>
            <div class="spacer"></div>
            <h3 style="font-size:17px;color:var(--gold-light);">Histórico por temporada</h3>
            <div class="spacer"></div>
            <div class="stack" style="text-align:left;">
                ${jogador.historicoTemporadas.length ? jogador.historicoTemporadas.map(t=>`<div class="train-row"><div><b>T${t.temporada}</b> · ${escapeHTML(t.divisao)}</div><div class="small">${t.jogos} J · ${t.gols} G · ${t.assistencias} A · Nota ${t.media}${t.tituloLiga?' · 🏆':''}</div></div>`).join("") : `<div class="notice">Sem temporadas registradas.</div>`}
            </div>
            <div class="spacer"></div>
            <button class="btn" onclick="apagarSaveEIniciar()">🚀 Começar nova carreira</button>
        </div></div>
    `;
}
function apagarSaveEIniciar(){ jogador=null; mostrarInicio(); }

/* =========================================================
   17) SALVAR / CARREGAR — múltiplas carreiras
========================================================= */

function listarCarreirasSalvas(){
    try{ return JSON.parse(localStorage.getItem(CONFIG.chaveListaSaves) || "{}"); }
    catch(e){ return {}; }
}
function salvarAutomaticamente(){
    if(!jogador || !jogador.id) return;
    try{
        const lista = listarCarreirasSalvas();
        lista[jogador.id] = { jogador, divisoes, calendario, tabela, abaHub, ofertaAtual, mundoStats, tabelasMundo, atualizadoEm: Date.now() };
        localStorage.setItem(CONFIG.chaveListaSaves, JSON.stringify(lista));
    }catch(e){ console.error("Erro ao salvar:",e); }
}
function salvarEConfirmar(){ salvarAutomaticamente(); toast("💾 Carreira salva."); }

function normalizarJogadorCarregado(){
    if(!jogador.atributos) jogador.atributos = {};
    if(!Array.isArray(jogador.eventos)) jogador.eventos=[];
    if(!Array.isArray(jogador.premios)) jogador.premios=[];
    if(!Array.isArray(jogador.transferencias)) jogador.transferencias=[];
    if(!Array.isArray(jogador.historicoTemporadas)) jogador.historicoTemporadas=[];
    if(!Array.isArray(jogador.rankingRivais)) jogador.rankingRivais=[];
    if(!jogador.mundoStats) jogador.mundoStats=[];
    if(!jogador.empresario) jogador.empresario = { nome:EMPRESARIOS_NOMES[rndInt(0,EMPRESARIOS_NOMES.length-1)], nivel:1, usouNegociacaoTemporada:false, ligacaoUsadaTemporada:false, clubeContato:null, contatoAteRodada:0 };
    if(jogador.empresario.ligacaoUsadaTemporada===undefined) jogador.empresario.ligacaoUsadaTemporada=false;
    if(jogador.empresario.clubeContato===undefined) jogador.empresario.clubeContato=null;
    if(jogador.empresario.contatoAteRodada===undefined) jogador.empresario.contatoAteRodada=0;
    if(jogador.rodadasSemProposta===undefined) jogador.rodadasSemProposta=0;
    if(jogador.clubeProximaTemporada===undefined) jogador.clubeProximaTemporada=null;
    if(jogador.divisaoProximaTemporada===undefined) jogador.divisaoProximaTemporada=null;
    if(jogador.ligaKey===undefined || !LIGAS_BASE[jogador.ligaKey]) jogador.ligaKey=jogador.pais && LIGAS_BASE[jogador.pais] ? jogador.pais : "Brasil";
    if(jogador.ligaProximaTemporada===undefined) jogador.ligaProximaTemporada=null;
    jogador.jogosCarreira ??= jogador.historicoTemporadas.reduce((a,t)=>a+(t.jogos||0),0) + (jogador.jogos||0);
    jogador.golsCarreira ??= jogador.historicoTemporadas.reduce((a,t)=>a+(t.gols||0),0) + (jogador.gols||0);
    jogador.assistenciasCarreira ??= jogador.historicoTemporadas.reduce((a,t)=>a+(t.assistencias||0),0) + (jogador.assistencias||0);
    jogador.somaNotasCarreira ??= jogador.historicoTemporadas.reduce((a,t)=>a+((t.jogos||0)*(t.media||0)),0) + (jogador.somaNotas||0);
    jogador.minutosCarreira ??= 0;
    jogador.defesasCarreira ??= 0; jogador.defesasDificeisCarreira ??= 0; jogador.golsSofridosCarreira ??= 0; jogador.jogosSemSofrerGolCarreira ??= 0; jogador.penaltisDefendidosCarreira ??= 0;
    jogador.titulosCarreira ??= 0; jogador.titulosLiga ??= 0;
    jogador.temporadaFinalizada ??= 0;
    if(jogador.condicionamento===undefined) jogador.condicionamento = 80;
    if(jogador.defesas===undefined){
        jogador.defesas=0; jogador.defesasDificeis=0; jogador.golsSofridos=0;
        jogador.jogosSemSofrerGol=0; jogador.penaltisDefendidos=0;
    }
    if(!jogador.id) jogador.id = "car_migrado_"+Date.now()+"_"+rndInt(1000,9999);
}

function carregarCarreira(id){
    try{
        const lista = listarCarreirasSalvas();
        const dados = lista[id];
        if(!dados){ alert("Carreira não encontrada."); return; }
        jogador = dados.jogador;
        divisoes = dados.divisoes || { A:[], B:[] };
        calendario = dados.calendario || [];
        tabela = dados.tabela || [];
        abaHub = dados.abaHub || "visao";
        ofertaAtual = dados.ofertaAtual || null;
        mundoStats = dados.mundoStats || Object.create(null);
        tabelasMundo = dados.tabelasMundo || Object.create(null);
        clubes = divisoes[jogador.divisao] || [];
        normalizarJogadorCarregado();
        if(jogador.aposentado) return mostrarAposentadoria();
        mostrarHub();
    }catch(e){
        console.error(e);
        alert("Essa carreira salva está corrompida ou incompatível.");
    }
}
function excluirCarreira(id){
    if(!confirm("Excluir esta carreira salva? Essa ação não pode ser desfeita.")) return;
    const lista = listarCarreirasSalvas();
    delete lista[id];
    localStorage.setItem(CONFIG.chaveListaSaves, JSON.stringify(lista));
    mostrarInicio();
}

// migra o save único de versões antigas do jogo pra dentro da nova lista de carreiras
function migrarSaveAntigoSeNecessario(){
    try{
        const antigo = localStorage.getItem(CONFIG.chaveSave);
        if(!antigo) return;
        const dados = JSON.parse(antigo);
        if(!dados.jogador) return;
        if(!dados.jogador.id) dados.jogador.id = "car_migrado_"+Date.now()+"_"+rndInt(1000,9999);
        const lista = listarCarreirasSalvas();
        lista[dados.jogador.id] = {
            jogador: dados.jogador,
            divisoes: dados.divisoes || { A:[], B:[] },
            calendario: dados.calendario || [],
            tabela: dados.tabela || [],
            abaHub: dados.abaHub || "visao",
            ofertaAtual: dados.ofertaAtual || null,
            mundoStats: dados.mundoStats || Object.create(null),
            tabelasMundo: dados.tabelasMundo || Object.create(null),
            atualizadoEm: Date.now()
        };
        localStorage.setItem(CONFIG.chaveListaSaves, JSON.stringify(lista));
        localStorage.removeItem(CONFIG.chaveSave);
    }catch(e){ console.error("Falha ao migrar save antigo:",e); }
}

/* =========================================================
   18) INICIALIZAÇÃO
========================================================= */

mostrarInicio();
carregarBancoElencos();

</script>
